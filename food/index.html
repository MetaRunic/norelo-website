<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Bouffe</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="Planificateur de repas prive."/>
<link rel="icon" href="/favicon.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   Bouffe. Page privee de la maison, donc le ton est volontairement plus
   sucre que le site vitrine: fond myrtille, accents bonbon, boutons
   epais qui s'enfoncent, autocollants legerement de travers.
   Les noms de classes sont ceux du script, ne pas les renommer.
   ===================================================================== */
:root{
 --dark:#120a26;--pan:#1d1138;--d3:#271750;--deep:#0c0618;
 --line:rgba(255,255,255,.10);--txt:#f4eeff;--dim:#a99bd0;
 --pink:#ff6fae;--peach:#ff9f68;--mint:#3fe0b0;--butter:#ffd84d;
 --lilac:#b48bff;--sky:#56c7ff;--berry:#ff4f81;
 /* alias gardes pour que rien ne casse */
 --blue:#7c5cff;--bl:#56c7ff;--bp:#b48bff;--gr:#a99bd0;
 --grn:#3fe0b0;--amb:#ffd84d;--rose:#ff4f81;--vio:#b48bff;
 --r:18px;--r2:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;color:var(--txt);overflow-x:hidden;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 background:var(--dark);
 /* un semis de points, pour que le fond ne soit pas une surface morte */
 background-image:radial-gradient(rgba(180,139,255,.085) 1px,transparent 1px),
   radial-gradient(circle at 12% -8%,rgba(255,111,174,.16),transparent 46%),
   radial-gradient(circle at 92% 4%,rgba(63,224,176,.12),transparent 42%);
 background-size:19px 19px,auto,auto;
 background-attachment:fixed;}
button{font-family:inherit;}
a{color:var(--lilac);}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;
 background:linear-gradient(120deg,rgba(39,23,80,.97),rgba(18,10,38,.97));
 backdrop-filter:blur(10px);border-bottom:2px solid rgba(180,139,255,.28);}
.bar{display:flex;align-items:center;gap:9px;padding:11px 13px 9px;}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.4px;flex:1;
 display:flex;align-items:center;gap:8px;}
h1 b{font-weight:800;
 background:linear-gradient(92deg,var(--pink),var(--butter),var(--mint),var(--sky),var(--pink));
 background-size:320% 100%;-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent;animation:pan 11s linear infinite;}
@keyframes pan{to{background-position:320% 0;}}
h1 span:first-child{display:inline-block;font-size:22px;animation:wig 3.6s ease-in-out infinite;}
@keyframes wig{0%,72%,100%{transform:rotate(0) scale(1);}
 80%{transform:rotate(-13deg) scale(1.13);}90%{transform:rotate(11deg) scale(1.13);}}
.lang{display:flex;border:2px solid rgba(255,255,255,.14);border-radius:999px;
 overflow:hidden;flex:none;background:var(--deep);}
.lang button{background:none;border:0;color:var(--dim);font:800 12px/1 system-ui;
 padding:7px 11px;cursor:pointer;letter-spacing:.3px;}
.lang button.on{background:linear-gradient(135deg,var(--pink),var(--berry));color:#fff;}
.who{background:var(--deep);border:2px solid rgba(255,255,255,.14);border-radius:999px;
 color:var(--txt);font:800 11.5px/1 system-ui;padding:7px 11px;cursor:pointer;flex:none;
 max-width:98px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who:active{transform:scale(.94);}

/* la pastille de niveau: c'est un jeu, donc elle brille un peu */
.lvl{display:flex;align-items:center;gap:8px;padding:0 13px 10px;}
.lvlbadge{display:flex;align-items:center;gap:5px;
 background:linear-gradient(135deg,var(--butter),var(--peach));
 border:0;border-radius:999px;padding:6px 12px;font:900 11.5px/1 system-ui;
 color:#44210a;flex:none;box-shadow:0 3px 0 #b9741f,0 6px 16px rgba(255,159,104,.35);
 transform:rotate(-2deg);}
.lvlbadge span:first-child{animation:tw 2.4s ease-in-out infinite;}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);}50%{transform:scale(1.26) rotate(19deg);}}
.xpwrap{flex:1;height:11px;background:var(--deep);border:2px solid rgba(255,255,255,.12);
 border-radius:999px;overflow:hidden;}
.xpbar{height:100%;width:0;border-radius:999px;
 background:linear-gradient(90deg,var(--mint),var(--butter),var(--peach));
 background-size:200% 100%;animation:pan 5s linear infinite;
 transition:width .65s cubic-bezier(.34,1.56,.64,1);
 box-shadow:0 0 12px rgba(255,216,77,.5);}
.xptxt{font:800 11px/1 system-ui;color:var(--dim);flex:none;}

/* ---------- onglets, en pastilles ---------- */
nav{display:flex;gap:6px;overflow-x:auto;padding:0 11px 11px;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav button{background:var(--pan);border:2px solid rgba(255,255,255,.1);
 border-radius:999px;color:var(--dim);font:800 12.5px/1 system-ui;padding:10px 14px;
 cursor:pointer;flex:none;display:flex;align-items:center;gap:6px;
 transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .16s,color .16s;}
nav button:active{transform:scale(.92);}
nav button.on{color:#2a0f1e;border-color:transparent;
 background:linear-gradient(135deg,var(--pink),var(--peach));
 box-shadow:0 3px 0 #c23c71;transform:translateY(-1px);}
nav .cnt{background:var(--berry);color:#fff;border-radius:999px;
 font:900 10px/1 system-ui;padding:3px 5px;min-width:17px;text-align:center;
 box-shadow:0 0 0 2px rgba(255,255,255,.18);}
nav button.on .cnt{background:#2a0f1e;}

main{padding:13px 11px 96px;max-width:1120px;margin:0 auto;}
section{display:none;}
section.on{display:block;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.99);}}

/* ---------- blocs ---------- */
.pan{background:linear-gradient(165deg,var(--pan),rgba(18,10,38,.72));
 border:2px solid rgba(255,255,255,.09);border-radius:var(--r2);
 padding:15px;margin-bottom:12px;box-shadow:0 7px 0 rgba(0,0,0,.26);}
.ttl{font:900 13.5px/1 system-ui;letter-spacing:-.2px;margin-bottom:10px;
 display:flex;align-items:center;gap:7px;}
.ttl .sp{margin-left:auto;font:800 11.5px/1 system-ui;color:var(--dim);}
.dim{color:var(--dim);font-size:12.5px;line-height:1.55;}

/* boutons epais, avec une ombre dure qui s'ecrase au doigt */
.btn{background:var(--d3);border:2px solid rgba(255,255,255,.12);border-radius:14px;
 color:var(--txt);font:800 12.5px/1 system-ui;padding:11px 13px;cursor:pointer;
 box-shadow:0 4px 0 rgba(0,0,0,.4);
 transition:transform .12s,box-shadow .12s;}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.4);}
.btn.pri{background:linear-gradient(135deg,var(--lilac),#7c5cff);border-color:transparent;
 color:#fff;box-shadow:0 4px 0 #4a2fb8;}
.btn.gr{background:linear-gradient(135deg,var(--mint),#1fb98c);border-color:transparent;
 color:#06281e;box-shadow:0 4px 0 #14805f;}
.btn.am{background:linear-gradient(135deg,var(--butter),var(--peach));border-color:transparent;
 color:#44210a;box-shadow:0 4px 0 #b9741f;}
.btn.wn{background:linear-gradient(135deg,#ff6f8e,var(--berry));border-color:transparent;
 color:#fff;box-shadow:0 4px 0 #a81f47;}
.btn.sm{padding:8px 10px;font-size:11.5px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.4);}
.btn.sm:active{transform:translateY(3px);}
.btn[disabled]{opacity:.42;cursor:default;transform:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.grow{flex:1 1 0;min-width:0;}
input,select,textarea{background:var(--deep);border:2px solid rgba(255,255,255,.12);
 border-radius:13px;color:var(--txt);font:600 13px/1.3 system-ui;padding:11px 12px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);
 box-shadow:0 0 0 4px rgba(255,111,174,.17);}
label{display:block;font:800 11px/1 system-ui;color:var(--dim);margin:0 0 5px;
 letter-spacing:.2px;}
.fld{margin-bottom:10px;}
.half{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.third{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}

/* ---------- bandeau de saison ---------- */
.seas{display:flex;gap:9px;align-items:center;
 background:linear-gradient(100deg,rgba(63,224,176,.17),rgba(29,17,56,.5));
 border:2px dashed rgba(63,224,176,.45);border-radius:var(--r2);
 padding:11px 13px;margin-bottom:12px;}
.seas .ic{font-size:22px;flex:none;animation:bob 2.9s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg);}
 50%{transform:translateY(-5px) rotate(6deg);}}
.seas .tx{font:700 12px/1.5 system-ui;color:#b9f5e2;}
.seas .tx b{color:#fff;}

/* ---------- semaine ---------- */
.wknav{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.wknav .lbl{flex:1;font:900 14px/1.2 system-ui;text-align:center;letter-spacing:-.2px;}
.wknav .lbl span{display:block;font:700 11px/1.3 system-ui;color:var(--dim);margin-top:3px;}
.days{display:grid;gap:11px;grid-template-columns:1fr;}
@media(min-width:900px){.days{grid-template-columns:repeat(7,1fr);gap:8px;}}
.day{background:linear-gradient(170deg,var(--pan),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.08);border-radius:var(--r2);overflow:hidden;
 box-shadow:0 6px 0 rgba(0,0,0,.24);}
.day.today{border-color:var(--pink);box-shadow:0 6px 0 #a8295c,0 0 26px rgba(255,111,174,.3);}
.dhd{display:flex;align-items:center;gap:7px;padding:10px 12px;
 background:rgba(255,255,255,.045);border-bottom:2px solid rgba(255,255,255,.07);}
.dhd .dn{font:900 12.5px/1 system-ui;letter-spacing:.2px;}
.dhd .dd{font:800 11px/1 system-ui;color:var(--dim);
 background:var(--deep);border-radius:999px;padding:4px 7px;}
.dhd .kc{margin-left:auto;font:800 10.5px/1 system-ui;color:var(--butter);}
.day.today .dhd .dn{color:var(--pink);}
.slot{padding:9px 10px;border-bottom:1px dashed rgba(255,255,255,.08);}
.slot:last-child{border-bottom:0;}
.sl{font:900 9.5px/1 system-ui;color:var(--lilac);letter-spacing:1.1px;
 text-transform:uppercase;margin-bottom:7px;}
.empty{display:flex;gap:6px;}
.empty button{flex:1;background:rgba(255,255,255,.035);
 border:2px dashed rgba(180,139,255,.42);border-radius:14px;color:var(--dim);
 font:800 11.5px/1 system-ui;padding:12px 4px;cursor:pointer;transition:transform .14s,color .14s;}
.empty button:active{transform:scale(.93);color:var(--pink);border-color:var(--pink);}

/* un repas planifie. la tuile est dessinee, jamais une photo, donc elle
   doit porter son propre caractere: une forme de galet irreguliere */
.meal{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%;
 background:none;border:0;padding:0;text-align:left;color:inherit;}
.meal:active{transform:scale(.975);}
.tile{width:48px;height:48px;flex:none;position:relative;
 display:flex;align-items:center;justify-content:center;font-size:22px;
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.4);
 overflow:hidden;border-radius:46% 54% 52% 48% / 50% 46% 54% 50%;}
.tile.s0{border-radius:58% 42% 54% 46% / 48% 56% 44% 52%;}
.tile.s1{border-radius:44% 56% 41% 59% / 58% 44% 56% 42%;}
.tile.s2{border-radius:53% 47% 62% 38% / 42% 54% 46% 58%;}
.tile.s3{border-radius:63% 37% 47% 53% / 56% 45% 55% 44%;}
.tile::after{content:"";position:absolute;inset:0;
 background:radial-gradient(circle at 29% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 56%);}
.tile span{position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));}
.tile.lg{width:64px;height:64px;font-size:30px;}
.tile.xl{width:96px;height:96px;font-size:45px;}
.day .tile{animation:fl 4.2s ease-in-out infinite;}
.day:nth-child(2n) .tile{animation-delay:-1.1s;}
.day:nth-child(3n) .tile{animation-delay:-2.3s;}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0);}
 50%{transform:translateY(-3px) rotate(2.5deg);}}
.mi{flex:1;min-width:0;}
.mi .nm{font:800 12.5px/1.32 system-ui;overflow:hidden;text-overflow:ellipsis;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.mi .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}

/* autocollants, legerement de travers */
.pill{font:900 9.5px/1 system-ui;padding:4px 7px;border-radius:999px;
 background:rgba(180,139,255,.2);color:#d9c8ff;border:1.5px solid rgba(180,139,255,.45);
 display:inline-block;transform:rotate(-1.6deg);}
.pill.g{background:rgba(63,224,176,.2);color:#b9f5e2;border-color:rgba(63,224,176,.5);
 transform:rotate(1.4deg);}
.pill.a{background:rgba(255,216,77,.2);color:#ffeaa8;border-color:rgba(255,216,77,.5);
 transform:rotate(-1.1deg);}
.pill.r{background:rgba(255,79,129,.2);color:#ffc7d6;border-color:rgba(255,79,129,.5);}
.pill.v{background:rgba(86,199,255,.18);color:#bfe9ff;border-color:rgba(86,199,255,.45);
 transform:rotate(1.2deg);}
.kind{font:800 10px/1 system-ui;color:var(--peach);margin-top:5px;}

/* ---------- bibliotheque ---------- */
.dishes{display:grid;gap:10px;grid-template-columns:1fr;}
@media(min-width:620px){.dishes{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.dishes{grid-template-columns:1fr 1fr 1fr;}}
.card{background:linear-gradient(165deg,var(--pan),rgba(18,10,38,.7));
 border:2px solid rgba(255,255,255,.09);border-radius:var(--r2);
 padding:12px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;
 text-align:left;color:inherit;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.26);
 transition:transform .14s,box-shadow .14s;}
.card:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,.26);}
.card .nm{font:900 13px/1.32 system-ui;}
.card .nu{font:700 10.5px/1 system-ui;color:var(--dim);margin-top:6px;}
.stars{display:flex;gap:2px;align-items:center;margin-top:6px;}
.stars i{font-style:normal;font-size:12px;color:#4a3a72;}
.stars i.f{color:var(--butter);filter:drop-shadow(0 0 4px rgba(255,216,77,.6));}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{background:var(--pan);border:2px solid rgba(255,255,255,.1);border-radius:999px;
 color:var(--dim);font:800 11.5px/1 system-ui;padding:9px 12px;cursor:pointer;flex:none;
 white-space:nowrap;transition:transform .14s;}
.chip:active{transform:scale(.92);}
.chip.on{background:linear-gradient(135deg,var(--mint),#1fb98c);color:#06281e;
 border-color:transparent;box-shadow:0 3px 0 #14805f;}

/* ---------- epicerie ---------- */
.store{margin-bottom:12px;border:2px solid rgba(255,255,255,.09);
 border-radius:var(--r2);overflow:hidden;
 background:linear-gradient(170deg,var(--pan),rgba(18,10,38,.7));
 box-shadow:0 6px 0 rgba(0,0,0,.24);}
.shd{display:flex;align-items:center;gap:8px;padding:12px 13px;
 background:linear-gradient(100deg,rgba(180,139,255,.18),transparent);
 border-bottom:2px solid rgba(255,255,255,.08);}
.shd .sn{font:900 13.5px/1 system-ui;letter-spacing:-.2px;}
.shd .sc{margin-left:auto;font:800 11px/1 system-ui;color:var(--dim);
 background:var(--deep);border-radius:999px;padding:5px 9px;}
.li{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
 border-bottom:1px dashed rgba(255,255,255,.07);}
.li:last-child{border-bottom:0;}
.li .bx{width:23px;height:23px;border-radius:8px;
 border:2.5px solid rgba(180,139,255,.5);flex:none;display:flex;
 align-items:center;justify-content:center;font-size:13px;color:#06281e;
 transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .16s;}
.li.ck .bx{background:linear-gradient(135deg,var(--mint),#1fb98c);
 border-color:var(--mint);transform:rotate(-9deg) scale(1.1);}
.li.ck .it{opacity:.38;text-decoration:line-through;}
.li .it{flex:1;font:700 12.5px/1.4 system-ui;}
.li .qt{font:900 12.5px/1 system-ui;color:var(--butter);flex:none;}
.li .ai{font:800 9.5px/1 system-ui;color:var(--lilac);flex:none;opacity:.8;}
.bulk{font:800 9.5px/1.3 system-ui;color:var(--peach);margin-top:3px;}

/* ---------- jeu ---------- */
.modes{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
.mode{background:linear-gradient(160deg,var(--d3),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.1);border-radius:var(--r2);
 padding:16px 11px;cursor:pointer;text-align:center;color:inherit;
 box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .14s,box-shadow .14s;}
.mode:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,.3);}
.mode .ic{font-size:31px;display:inline-block;animation:bob 3.4s ease-in-out infinite;}
.mode:nth-child(2n) .ic{animation-delay:-.9s;}
.mode .nm{font:900 13px/1.2 system-ui;margin-top:8px;}
.mode .ds{font:600 10.5px/1.45 system-ui;color:var(--dim);margin-top:5px;}

/* la roue est un degrade conique, donc ni svg ni librairie */
.wheelwrap{position:relative;width:min(84vw,330px);margin:16px auto 0;}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;position:relative;
 border:5px solid var(--d3);
 box-shadow:0 14px 42px rgba(0,0,0,.6),inset 0 0 0 8px rgba(255,255,255,.07),
  0 0 0 3px rgba(255,216,77,.45);
 transition:transform 4.6s cubic-bezier(.12,.72,.03,1);}
.wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:27%;height:27%;border-radius:50%;background:var(--d3);
 border:3px solid var(--butter);display:flex;align-items:center;justify-content:center;
 font-size:25px;box-shadow:0 0 22px rgba(255,216,77,.45);}
.ptr{position:absolute;left:50%;top:-13px;transform:translateX(-50%);
 width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
 border-top:22px solid var(--pink);z-index:3;
 filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));}
.wlbl{position:absolute;font:900 9.5px/1 system-ui;color:#fff;
 text-shadow:0 1px 4px rgba(0,0,0,.95);pointer-events:none;white-space:nowrap;
 transform-origin:0 50%;}

/* duel */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
.duel .vs{font:900 17px/1 system-ui;
 background:linear-gradient(135deg,var(--pink),var(--butter));
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 animation:tw 1.7s ease-in-out infinite;}
.fighter{background:linear-gradient(160deg,var(--d3),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.1);border-radius:var(--r2);
 padding:14px 10px;cursor:pointer;text-align:center;color:inherit;
 box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .13s,box-shadow .13s,border-color .13s;}
.fighter:active{transform:translateY(5px) scale(.98);box-shadow:0 0 0 rgba(0,0,0,.3);
 border-color:var(--pink);}
.fighter .nm{font:900 12px/1.3 system-ui;margin-top:9px;}
.fighter .nu{font:800 10px/1 system-ui;color:var(--dim);margin-top:6px;}
.bracket{font:800 11px/1 system-ui;color:var(--dim);text-align:center;margin-top:13px;}

/* badges, en autocollants de travers */
.badges{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));}
.bdg{background:var(--pan);border:2px dashed rgba(255,255,255,.14);border-radius:var(--r);
 padding:12px 7px;text-align:center;opacity:.34;transform:rotate(-1.4deg);}
.bdg:nth-child(2n){transform:rotate(1.6deg);}
.bdg.got{opacity:1;border-style:solid;border-color:var(--butter);
 background:linear-gradient(160deg,rgba(255,216,77,.2),rgba(18,10,38,.8));
 box-shadow:0 4px 0 rgba(185,116,31,.6),0 0 20px rgba(255,216,77,.22);}
.bdg .ic{font-size:24px;}
.bdg.got .ic{animation:tw 2.8s ease-in-out infinite;}
.bdg .nm{font:900 9.5px/1.25 system-ui;margin-top:6px;}
.bdg .ds{font:600 8.5px/1.35 system-ui;color:var(--dim);margin-top:3px;}

/* journal de points */
.slog{display:flex;align-items:center;gap:10px;padding:9px 0;
 border-bottom:1px dashed rgba(255,255,255,.07);}
.slog:last-child{border-bottom:0;}
.slog .sx{font:900 12.5px/1 system-ui;color:var(--mint);flex:none;
 background:rgba(63,224,176,.14);border-radius:999px;padding:4px 8px;}
.slog .st{flex:1;font:700 12px/1.4 system-ui;}
.slog .sd{font:600 10px/1 system-ui;color:var(--dim);flex:none;}

/* ---------- barres de nutrition ---------- */
.nut{display:grid;gap:9px;grid-template-columns:1fr 1fr;}
.nb{background:var(--deep);border:2px solid rgba(255,255,255,.09);

.nb .nl{font:800 10.5px/1 system-ui;color:var(--dim);display:flex;letter-spacing:.2px;}
.nb .nl span{margin-left:auto;color:var(--txt);font-weight:900;font-size:12px;}
.nb .tr{height:9px;background:rgba(255,255,255,.07);border-radius:999px;
 margin-top:8px;overflow:hidden;}
.nb .fi{height:100%;width:0;border-radius:999px;
 transition:width .6s cubic-bezier(.34,1.56,.64,1);}

/* ---------- feuille ---------- */
.scrim{position:fixed;inset:0;z-index:45;background:rgba(8,4,18,.76);
 backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .22s;}
.scrim.up{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;
 background:linear-gradient(175deg,var(--d3),var(--dark));
 border-top:3px solid var(--pink);border-radius:var(--r2) var(--r2) 0 0;
 padding:17px 16px calc(24px + env(safe-area-inset-bottom));
 transform:translateY(112%);transition:transform .34s cubic-bezier(.3,1.4,.5,1);
 max-height:88vh;overflow-y:auto;max-width:620px;margin:0 auto;
 box-shadow:0 -14px 46px rgba(0,0,0,.6);}
.sheet.up{transform:translateY(0);}
.sh{display:flex;align-items:flex-start;gap:11px;margin-bottom:13px;}
.sh h2{margin:0;font-size:19px;line-height:1.26;flex:1;font-weight:900;letter-spacing:-.3px;}
.sh .x{background:var(--deep);border:2px solid rgba(255,255,255,.13);border-radius:12px;
 color:var(--dim);font:800 15px/1 system-ui;padding:8px 11px;cursor:pointer;flex:none;}
.sh .x:active{transform:scale(.9);}
.steps{font:600 12.5px/1.68 system-ui;color:var(--txt);white-space:pre-wrap;
 background:var(--deep);border-radius:var(--r);padding:12px 13px;
 border-left:4px solid var(--mint);}
.ingl{margin:0;padding:0;list-style:none;}
.ingl li{display:flex;gap:9px;padding:9px 0;align-items:center;
 border-bottom:1px dashed rgba(255,255,255,.07);font:700 12.5px/1.35 system-ui;}
.ingl li:last-child{border-bottom:0;}
.ingl .q{color:var(--butter);font-weight:900;flex:none;min-width:66px;}
.ingl .s{margin-left:auto;font:800 10px/1 system-ui;color:var(--lilac);flex:none;
 background:rgba(180,139,255,.15);border-radius:999px;padding:4px 8px;}
.rate{display:flex;gap:7px;justify-content:center;margin:6px 0 0;}
.rate button{background:none;border:0;font-size:30px;cursor:pointer;color:#4a3a72;
 padding:2px;transition:transform .16s cubic-bezier(.34,1.56,.64,1),color .16s;}
.rate button:active{transform:scale(1.32) rotate(-11deg);}
.rate button.f{color:var(--butter);filter:drop-shadow(0 0 7px rgba(255,216,77,.65));}

/* ---------- confettis et avis ---------- */
#cv{position:fixed;inset:0;z-index:90;pointer-events:none;}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,150%);
 z-index:95;background:linear-gradient(135deg,var(--butter),var(--peach));
 border:0;border-radius:var(--r);padding:13px 17px;
 font:900 13.5px/1.3 system-ui;color:#44210a;

.toast.up{transform:translate(-50%,0) rotate(-1.4deg);}
.toast .sub{display:block;font:700 11px/1.45 system-ui;color:#6b3a12;margin-top:3px;}

/* ---------- porte d'entree ---------- */
.gate{max-width:390px;margin:8vh auto 0;padding:0 16px;}
.gate .lg{text-align:center;font-size:52px;margin-bottom:10px;

.gate h2{text-align:center;font-size:27px;margin:0 0 7px;font-weight:900;

.gate p{text-align:center;color:var(--dim);font-size:12.5px;line-height:1.6;margin:0 0 18px;}
.warn{background:linear-gradient(150deg,rgba(255,216,77,.16),rgba(18,10,38,.6));

.warn b{color:#fff;}
.warn code{background:rgba(0,0,0,.42);padding:2px 6px;border-radius:6px;

.err{color:#ffc7d6;font:700 11.5px/1.45 system-ui;margin-top:10px;}

footer{text-align:center;color:var(--dim);font-size:11px;padding:0 0 28px;

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

<!-- ============ gate: config warning, then login ============ -->
<div class="gate" id="gate" style="display:none">
  <div class="lg">&#127858;</div>
  <h2 data-i="appname"></h2>
  <p data-i="gatesub"></p>
  <div class="warn" id="cfgwarn" style="display:none"></div>
  <div id="loginbox">
    <div class="fld"><label data-i="email"></label>
      <input id="gmail" type="email" autocomplete="username" inputmode="email"/></div>
    <div class="fld"><label data-i="pass"></label>
      <input id="gpass" type="password" autocomplete="current-password"/></div>
    <button class="btn pri" style="width:100%" id="gbtn" onclick="doLogin()" data-i="enter"></button>
    <div class="err" id="gerr"></div>
  </div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn sm" onclick="useLocal()" data-i="trylocal"></button>
  </div>
</div>

<!-- ============ app ============ -->
<div id="app" style="display:none">

<header>
  <div class="bar">
    <h1><span>&#127858;</span> <b data-i="appname"></b></h1>
    <button class="who" id="whob" onclick="openMe()"></button>
    <div class="lang">
      <button id="lfr" onclick="setLang('fr')">FR</button>
      <button id="len" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="lvl">
    <div class="lvlbadge"><span>&#9733;</span><span id="lvn"></span></div>
    <div class="xpwrap"><div class="xpbar" id="xpb"></div></div>
    <div class="xptxt" id="xpt"></div>
  </div>
  <nav>
    <button id="nw" class="on" onclick="go('w')" data-i="tabweek"></button>
    <button id="nd" onclick="go('d')" data-i="tabdish"></button>
    <button id="ng" onclick="go('g')"><span data-i="tabshop"></span><span class="cnt" id="gcnt"></span></button>
    <button id="nj" onclick="go('j')" data-i="tabgame"></button>
    <button id="ns" onclick="go('s')" data-i="tabstats"></button>
  </nav>
</header>

<main>

  <!-- ---------- week ---------- -->
  <section id="tw" class="on">
    <div class="seas"><div class="ic">&#127810;</div>
      <div class="tx"><b data-i="seastitle"></b> <span id="seasitems"></span></div></div>

    <div class="wknav">
      <button class="btn sm" onclick="shiftWeek(-1)">&#8249;</button>
      <div class="lbl"><span id="wklbl"></span><span id="wksub"></span></div>
      <button class="btn sm" onclick="shiftWeek(1)">&#8250;</button>
    </div>

    <div class="pan">
      <div class="ttl"><span data-i="wkgoal"></span>
        <span class="sp" id="wkfill"></span></div>
      <div class="nut" id="wknut"></div>
      <div class="row" style="margin-top:11px">
        <button class="btn am grow" onclick="surpriseWeek()" data-i="surprise"></button>
        <button class="btn grow" onclick="go('j')" data-i="pickgame"></button>
      </div>
    </div>

    <div class="days" id="days"></div>
  </section>

  <!-- ---------- dishes ---------- -->
  <section id="td">
    <div class="row" style="margin-bottom:10px">
      <input class="grow" id="dq" oninput="renderDishes()" data-ip="search"/>
      <button class="btn pri" onclick="editDish(null)" data-i="adddish"></button>
    </div>
    <div class="filters" id="dfilters"></div>
    <div class="pan" id="seedpan" style="display:none">
      <div class="ttl" data-i="seedttl"></div>
      <p class="dim" data-i="seedsub"></p>
      <button class="btn gr" onclick="seedLib()" data-i="seedgo"></button>
    </div>
    <div class="dishes" id="dishes"></div>
  </section>

  <!-- ---------- grocery ---------- -->
  <section id="tg">
    <div class="pan">
      <div class="ttl"><span data-i="shopttl"></span><span class="sp" id="shopsum"></span></div>
      <p class="dim" data-i="shopsub"></p>
      <div class="row" style="margin-top:9px">
        <button class="btn sm" onclick="togglePacked()" id="packb" data-i="hidechecked"></button>
        <button class="btn sm wn" onclick="resetList()" data-i="uncheckall"></button>
      </div>
    </div>
    <div class="warn" id="thuwarn" style="display:none"></div>
    <div id="shoplist"></div>

    <div class="pan">
      <div class="ttl" data-i="pantryttl"></div>
      <p class="dim" data-i="pantrysub"></p>
      <div class="row" style="margin-top:9px">
        <input class="grow" id="pqi" data-ip="pantryadd"/>
        <button class="btn" onclick="addPantry()" data-i="add"></button>
      </div>
      <div id="pantry" style="margin-top:9px"></div>
    </div>

    <div class="pan">
      <div class="ttl" data-i="spendttl"></div>
      <div class="row">
        <select id="spst" style="flex:1 1 110px"></select>
        <input id="spam" type="number" step="0.01" inputmode="decimal" style="flex:1 1 84px" data-ip="amount"/>
        <button class="btn" onclick="addShop()" data-i="add"></button>
      </div>
      <div id="spend" style="margin-top:9px"></div>
    </div>
  </section>

  <!-- ---------- game ---------- -->
  <section id="tj">
    <div class="pan">
      <div class="ttl"><span data-i="howpick"></span></div>
      <div class="modes">
        <button class="mode" onclick="openRoulette()">
          <div class="ic">&#127920;</div><div class="nm" data-i="m_roul"></div>
          <div class="ds" data-i="m_rouls"></div></button>
        <button class="mode" onclick="openDuel()">
          <div class="ic">&#9876;</div><div class="nm" data-i="m_duel"></div>
          <div class="ds" data-i="m_duels"></div></button>
        <button class="mode" onclick="openDice()">
          <div class="ic">&#127922;</div><div class="nm" data-i="m_dice"></div>
          <div class="ds" data-i="m_dices"></div></button>
        <button class="mode" onclick="go('d')">
          <div class="ic">&#128269;</div><div class="nm" data-i="m_man"></div>
          <div class="ds" data-i="m_mans"></div></button>
      </div>
    </div>

    <div class="pan">
      <div class="ttl"><span data-i="scorettl"></span><span class="sp" id="wkpts"></span></div>
      <p class="dim" data-i="scoresub"></p>
      <div id="scorelog" style="margin-top:9px"></div>
    </div>

    <div class="pan">
      <div class="ttl" data-i="badgettl"></div>
      <div class="badges" id="badges"></div>
    </div>
  </section>

  <!-- ---------- stats ---------- -->
  <section id="ts">
    <div class="pan">
      <div class="ttl" data-i="streakttl"></div>
      <div class="nut" id="streaks"></div>
    </div>
    <div class="pan">
      <div class="ttl" data-i="hallttl"></div>
      <p class="dim" data-i="hallsub"></p>
      <div id="hall" style="margin-top:9px"></div>
    </div>
    <div class="pan">
      <div class="ttl" data-i="neverttl"></div>
      <div id="never" style="margin-top:4px"></div>
    </div>
    <div class="pan">
      <div class="ttl" data-i="fadedttl"></div>
      <p class="dim" data-i="fadedsub"></p>
      <div id="faded" style="margin-top:9px"></div>
    </div>
  </section>

</main>

<footer><span data-i="foot"></span> &middot; v<span id="ver"></span></footer>
</div>

/* =====================================================================
   Couche de données. Les mêmes fonctions servent en mode Supabase et en
   mode local, pour que tout le code d'affichage ne connaisse qu'une
   seule interface. Voir SPEC section 2.
   ===================================================================== */

const TBL = { dishes:'dishes', ings:'ingredients', plan:'plan', ratings:'ratings',
              pantry:'pantry', list:'list_state', shops:'shops', score:'score',
              members:'members' };

const DB = { dishes:[], ings:[], plan:[], ratings:[], pantry:[], list:[],
             shops:[], score:[], members:[] };
let LID = 1;

function saveLocal(){
  if (!LOCAL) return;
  try { localStorage.setItem('bouffe_db', JSON.stringify({ db:DB, lid:LID, me:ME })); }
  catch(e){}
}
function readLocal(){
  try {
    var j = localStorage.getItem('bouffe_db');
    if (!j) return false;
    var o = JSON.parse(j);
    for (var k in DB) if (o.db && o.db[k]) DB[k] = o.db[k];
    LID = o.lid || 1;
    ME = o.me || null;
    return true;
  } catch(e){ return false; }
}

async function ins(key, row){
  if (LOCAL){ row.id = LID++; DB[key].push(row); saveLocal(); return row; }
  var r = await sb.from(TBL[key]).insert(row).select().single();
  if (r.error) throw r.error;
  DB[key].push(r.data);
  return r.data;
}
async function upd(key, id, patch){
  var arr = DB[key], i;
  for (i = 0; i < arr.length; i++) if (arr[i].id === id) break;
  if (LOCAL){
    if (i < arr.length) for (var p in patch) arr[i][p] = patch[p];
    saveLocal(); return arr[i];
  }
  var r = await sb.from(TBL[key]).update(patch).eq('id', id).select().single();
  if (r.error) throw r.error;
  if (i < arr.length) arr[i] = r.data;
  return r.data;
}
async function del(key, id){
  if (!LOCAL){
    var r = await sb.from(TBL[key]).delete().eq('id', id);
    if (r.error) throw r.error;
  }
  DB[key] = DB[key].filter(function(x){ return x.id !== id; });
  saveLocal();
}

/* list_state porte une clé composée, donc elle a sa propre écriture */
async function setCheck(week, itemKey, on){
  var row = null;
  for (var i = 0; i < DB.list.length; i++)
    if (DB.list[i].week_start === week && DB.list[i].item_key === itemKey) row = DB.list[i];
  if (row){ row.checked = on; }
  else { row = { week_start:week, item_key:itemKey, checked:on }; DB.list.push(row); }
  if (LOCAL){ saveLocal(); return; }
  var r = await sb.from(TBL.list).upsert({ week_start:week, item_key:itemKey, checked:on },
          { onConflict:'week_start,item_key' });
  if (r.error) throw r.error;
}
function isChecked(week, itemKey){
  for (var i = 0; i < DB.list.length; i++)
    if (DB.list[i].week_start === week && DB.list[i].item_key === itemKey)
      return !!DB.list[i].checked;
  return false;
}

async function loadAll(){
  if (LOCAL) return;
  var names = ['dishes','ings','plan','ratings','pantry','list','shops','score','members'];
  var res = await Promise.all(names.map(function(k){ return sb.from(TBL[k]).select('*'); }));
  for (var i = 0; i < names.length; i++){
    if (res[i].error) throw res[i].error;
    DB[names[i]] = res[i].data || [];
  }
  MEMBERS = DB.members;
}

/* =====================================================================
   Dates. Tout est ancré sur le lundi, parce que la semaine d'épicerie
   et la semaine de pointage doivent être la même.
   ===================================================================== */

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
function parseISO(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var w = x.getDay();            /* 0 dimanche, 1 lundi */
  return addDays(x, w === 0 ? -6 : 1 - w);
}
let WK = mondayOf(new Date());
let BULK = false;   /* vrai pendant un remplissage en lot, voir surpriseWeek */
function wkISO(){ return iso(WK); }
function todayISO(){ return iso(new Date()); }

/* =====================================================================
   Tuiles dessinées. Aucune photo, aucune image externe, voir SPEC
   section 2. Le dégradé sort du nom, donc un plat garde toujours la
   même couleur, et le glyphe sort du plat lui-même.
   ===================================================================== */

function hashOf(s){
  var h = 0;
  for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function tileStyle(name){
  var h = hashOf(name || 'x') % 360;
  return 'background:linear-gradient(140deg,hsl(' + h + ',74%,56%),hsl(' +
         ((h + 46) % 360) + ',72%,34%))';
}
function tileShape(name){ return 's' + (hashOf(name || 'x') % 4); }
const GLYPHS = [
 ['poulet|chicken',      '\u{1F357}'],
 ['dinde|turkey',        '\u{1F983}'],
 ['saumon|poisson|tilapia|fish|salmon', '\u{1F41F}'],
 ['crevette|shrimp',     '\u{1F364}'],
 ['boeuf|beef',          '\u{1F969}'],
 ['porc|pork',           '\u{1F953}'],
 ['omelette|oeuf|egg',   '\u{1F373}'],
 ['pizza',               '\u{1F355}'],
 ['soupe|soup',          '\u{1F963}'],
 ['salade|salad|cesar|césar|caesar', '\u{1F957}'],
 ['chili',               '\u{1F336}'],
 ['burrito|bol|bowl',    '\u{1F32F}'],
 ['dahl|lentille|lentil|haricot|bean', '\u{1F372}'],
 ['tofu',                '\u{1F331}'],
 ['pâté|pate|pie',       '\u{1F958}'],
 ['mijoteuse|slow',      '\u{1F372}']
];
function glyphOf(d){
  var n = ((d && (d.name_fr || '')) + ' ' + (d && (d.name_en || ''))).toLowerCase();
  for (var i = 0; i < GLYPHS.length; i++){
    var parts = GLYPHS[i][0].split('|');
    for (var j = 0; j < parts.length; j++) if (n.indexOf(parts[j]) >= 0) return GLYPHS[i][1];
  }
  var tg = (d && d.tags) || [];
  if (tg.indexOf('t_vegetarian') >= 0) return '\u{1F966}';
  if (tg.indexOf('t_bbq') >= 0) return '\u{1F356}';
  return '\u{1F37D}';
}
function tile(d, cls){
  var n = dname(d);
  return '<div class="tile ' + tileShape(n) + ' ' + (cls || '') + '" style="' +
         tileStyle(n) + '"><span>' + glyphOf(d) + '</span></div>';
}
function dtext(d, base){
  if (!d) return '';
  var a = d[base + '_fr'], b = d[base + '_en'];
  return (L === 'fr' ? (a || b) : (b || a)) || '';
}
function dname(d){
  if (!d) return '';
  return (L === 'fr' ? (d.name_fr || d.name_en) : (d.name_en || d.name_fr)) || '';
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
         .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function dishById(id){
  for (var i = 0; i < DB.dishes.length; i++) if (DB.dishes[i].id === id) return DB.dishes[i];
  return null;
}
function num(v, d){ var n = parseFloat(v); return isNaN(n) ? (d === undefined ? 0 : d) : n; }

function planFor(dayIso, slot){
  for (var i = 0; i < DB.plan.length; i++)
    if (DB.plan[i].day === dayIso && DB.plan[i].slot === slot) return DB.plan[i];
  return null;
}
async function setPlan(dayIso, slot, fields){
  var row = planFor(dayIso, slot);
  var wasNew = !row || row.dish_id !== fields.dish_id;
  if (row) await upd('plan', row.id, fields);
  else {
    var o = { day:dayIso, slot:slot, kind:'cook', dish_id:null, cook_id:null, wash_id:null };
    for (var p in fields) o[p] = fields[p];
    await ins('plan', o);
  }
  if (wasNew && fields.dish_id) await scoreForDish(fields.dish_id, dayIso);
  if (BULK) return;
  await scoreWeek();
  renderAll();
}
async function clearPlan(dayIso, slot){
  var row = planFor(dayIso, slot);
  if (row) await del('plan', row.id);
  renderAll();
}

function weekDays(){
  var a = [], i;
  for (i = 0; i < 7; i++) a.push(iso(addDays(WK, i)));
  return a;
}

/* La portion de chacun sort du même plat, voir SPEC section 6. */
function myMult(){ return num(ME && ME.portion_mult, 1) || 1; }

function weekNut(){
  var days = weekDays(), m = myMult();
  var kcal = 0, prot = 0, veg = 0, home = 0, planned = 0, cost = 0;
  for (var i = 0; i < days.length; i++){
    for (var s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (!p) continue;
      planned++;
      if (p.kind === 'cook' || p.kind === 'leftovers'){
        if (p.kind === 'cook') home++;
        var d = dishById(p.dish_id);
        if (d){
          kcal += num(d.kcal) * m;
          prot += num(d.protein_g) * m;
          veg  += num(d.veg_serv) * m;
          if (p.kind === 'cook') cost += num(d.cost_est) / Math.max(1, num(d.servings, 2)) * 2;
        }
      }
    }
  }
  return { kcal:kcal/7, prot:prot/7, veg:veg/7, home:home, planned:planned, cost:cost };
}

function bar(label, val, target, unit, mode){
  /* mode 'ceil': rester dessous est le but, donc vert dessous, ambre dessus.
     mode 'floor': atteindre est le but, donc vert quand atteint. */
  var pct = target > 0 ? Math.min(100, Math.round(val / target * 100)) : 0;
  var col;
  if (mode === 'ceil') col = (target > 0 && val > target) ? 'var(--amb)' : 'var(--grn)';
  else col = (target > 0 && val >= target) ? 'var(--grn)' : 'var(--bp)';
  var over = (mode === 'ceil' && target > 0 && val > target);
  return '<div class="nb"><div class="nl">' + esc(label) + '<span>' +
    Math.round(val) + (unit ? ' ' + esc(unit) : '') + '</span></div>' +
    '<div class="tr"><div class="fi" style="width:' + (over ? 100 : pct) +
    '%;background:' + col + '"></div></div></div>';
}

function renderSeason(){
  var m = new Date().getMonth();
  document.getElementById('seasitems').textContent = SEASON[m][L] || SEASON[m].fr;
}

function renderWeek(){
  renderSeason();
  var days = weekDays();
  var first = WK, last = addDays(WK, 6);
  document.getElementById('wklbl').textContent =
    first.getDate() + ' ' + t('mon')[first.getMonth()] + ' ' +
    '- ' + last.getDate() + ' ' + t('mon')[last.getMonth()];
  document.getElementById('wksub').textContent = first.getFullYear();

  var n = weekNut();
  document.getElementById('wkfill').textContent = tf('wkfilln', { n:n.planned });
  var kt = num(ME && ME.kcal_target), pt = num(ME && ME.protein_target);
  document.getElementById('wknut').innerHTML =
    bar(t('n_kcal'), n.kcal, kt, t('u_kcal'), 'ceil') +
    bar(t('n_prot'), n.prot, pt, 'g', 'floor') +
    bar(t('n_veg'), n.veg, 5, '', 'floor') +
    bar(t('n_home'), n.home, 14, '/14', 'floor') +
    '<div class="dim" style="grid-column:1/-1;margin-top:2px">' + esc(t('nutnote')) + '</div>';

  var today = todayISO(), h = '';
  for (var i = 0; i < 7; i++){
    var di = days[i], dd = parseISO(di);
    var dk = 0, ds = ['lunch','supper'], sh = '';
    for (var s = 0; s < 2; s++){
      var p = planFor(di, ds[s]);
      sh += '<div class="slot"><div class="sl">' + esc(t(ds[s])) + '</div>';
      if (!p){
        sh += '<div class="empty">' +
          '<button onclick="openSlot(\'' + di + '\',\'' + ds[s] + '\')">' + esc(t('e_pick')) + '</button>' +
          '<button onclick="spinInto(\'' + di + '\',\'' + ds[s] + '\')">' + esc(t('e_spin')) + '</button>' +
          '</div>';
      } else {
        var d = dishById(p.dish_id);
        if (d) dk += num(d.kcal) * myMult();
        var nm = d ? dname(d) : t('k_' + p.kind);
        var mt = '';
        if (d){
          if (num(d.prep_min)) mt += '<span class="pill">' + num(d.prep_min) + ' ' + esc(t('u_min')) + '</span>';
          if (num(d.kcal)) mt += '<span class="pill' + (num(d.kcal) < 500 ? ' g' : '') + '">' +
            num(d.kcal) + ' ' + esc(t('u_kcal')) + '</span>';
          if (num(d.protein_g)) mt += '<span class="pill a">' + num(d.protein_g) + ' g</span>';
        }
        sh += '<button class="meal" onclick="openSlot(\'' + di + '\',\'' + ds[s] + '\')">' +
          tile(d) + '<div class="mi"><div class="nm">' + esc(nm) + '</div>' +
          '<div class="mt">' + mt + '</div>' +
          (p.kind !== 'cook' ? '<div class="kind">' + esc(t('k_' + p.kind)) + '</div>' : '') +
          '</div></button>';
      }
      sh += '</div>';
    }
    h += '<div class="day' + (di === today ? ' today' : '') + '">' +
      '<div class="dhd"><span class="dn">' + esc(t('dayn')[i]) + '</span>' +
      '<span class="dd">' + dd.getDate() + '</span>' +
      '<span class="kc">' + (dk ? Math.round(dk) + ' ' + esc(t('u_kcal')) : '') + '</span></div>' +
      sh + '</div>';
  }
  document.getElementById('days').innerHTML = h;
}
function shiftWeek(n){ WK = addDays(WK, n * 7); renderAll(); }

/* ---- feuille de choix d'un créneau ---- */
function openSlot(dayIso, slot){
  var dIdx = Math.round((parseISO(dayIso) - WK) / 86400000);

  var h = '<div class="sh"><h2>' + esc(t('dayn')[(dIdx + 7) % 7]) + ', ' +
    esc(t(slot)).toLowerCase() + '</h2>' +
    '<button class="x" onclick="closeSheet()">&#10005;</button></div>';

  if (cur){
    var cd = dishById(cur.dish_id);
    h += '<div class="pan" style="margin-bottom:12px"><div class="row">' +
      tile(cd, 'lg') + '<div class="grow"><div style="font:700 13px system-ui">' +
      esc(cd ? dname(cd) : t('k_' + cur.kind)) + '</div>' +
      '<div class="dim">' + esc(t('k_' + cur.kind)) + '</div></div></div>' +
      '<div class="row" style="margin-top:9px">' +
      (cd ? '<button class="btn sm grow" onclick="openDish(' + cur.dish_id + ')">' + esc(t('edit')) + '</button>' : '') +
      '<button class="btn sm grow" onclick="askCooks(\'' + dayIso + '\',\'' + slot + '\')">' + esc(t('cooks')) + '</button>' +
      '<button class="btn sm wn grow" onclick="clearSlot(\'' + dayIso + '\',\'' + slot + '\')">' + esc(t('clearslot')) + '</button>' +
      '</div></div>';
  }

  h += '<div class="ttl">' + esc(t('pickdish')) + '</div><div id="slotlist">' + dishRows(dayIso, slot, 'cook') + '</div>';

  var lefts = leftoverCandidates(dayIso);
  if (lefts.length){
    h += '<div class="ttl" style="margin-top:14px">' + esc(t('leftoverof')) + '</div><div>' +
      lefts.map(function(d){
        return '<button class="card" style="margin-bottom:7px" onclick="pickSlot(\'' +
          dayIso + '\',\'' + slot + '\',' + d.id + ',\'leftovers\')">' + tile(d) +
          '<div class="mi"><div class="nm">' + esc(dname(d)) + '</div></div></button>';
      }).join('') + '</div>';
  }

  h += '<div class="ttl" style="margin-top:14px">' + esc(t('otherwise')) + '</div><div class="row">' +
    ['takeout','restaurant','out'].map(function(k){
      return '<button class="btn grow" onclick="pickSlot(\'' + dayIso + '\',\'' + slot +
        '\',null,\'' + k + '\')">' + esc(t('k_' + k)) + '</button>';
    }).join('') + '</div>';

  openSheet(h);
}
function dishRows(dayIso, slot, kind){
  if (!DB.dishes.length) return '<p class="dim">' + esc(t('nodishes')) + '</p>';
  var ds = DB.dishes.slice().sort(function(a, b){ return dname(a).localeCompare(dname(b)); });
  return ds.map(function(d){
    return '<button class="card" style="margin-bottom:7px" onclick="pickSlot(\'' + dayIso +
      '\',\'' + slot + '\',' + d.id + ',\'' + kind + '\')">' + tile(d) +
      '<div class="mi"><div class="nm">' + esc(dname(d)) + '</div><div class="nu">' +
      (num(d.kcal) ? num(d.kcal) + ' ' + esc(t('u_kcal')) + ' &middot; ' : '') +
      (num(d.protein_g) ? num(d.protein_g) + ' ' + esc(t('u_prot')) + ' &middot; ' : '') +
      num(d.prep_min) + ' ' + esc(t('u_min')) + '</div></div></button>';
  }).join('');
}
function leftoverCandidates(dayIso){
  var out = [], seen = {}, days = weekDays();
  for (var i = 0; i < days.length; i++){
    if (days[i] >= dayIso) continue;
    for (var s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (p && p.kind === 'cook' && p.dish_id && !seen[p.dish_id]){
        var d = dishById(p.dish_id);
        if (d){ seen[p.dish_id] = 1; out.push(d); }
      }
    }
  }
  return out;
}

    '<button class="btn pri" style="width:100%" onclick="saveCooks(\'' + dayIso + '\',\'' + slot + '\')">' +

function ratingFor(dishId, memberId){
  for (var i = 0; i < DB.ratings.length; i++)
    if (DB.ratings[i].dish_id === dishId && DB.ratings[i].member_id === memberId)
      return DB.ratings[i];
  return null;
}
function dishScore(dishId){
  var s = 0, n = 0;
  for (var i = 0; i < DB.ratings.length; i++)
    if (DB.ratings[i].dish_id === dishId){ s += num(DB.ratings[i].stars); n++; }
  return { sum:s, n:n, avg:n ? s / n : 0 };
}
async function setRating(dishId, stars){
  var row = ratingFor(dishId, ME.id);
  if (row) row.stars = stars;
  else { row = { dish_id:dishId, member_id:ME.id, stars:stars }; DB.ratings.push(row); }
  if (LOCAL) saveLocal();
  else {
    var r = await sb.from(TBL.ratings).upsert(
      { dish_id:dishId, member_id:ME.id, stars:stars }, { onConflict:'dish_id,member_id' });
    if (r.error) throw r.error;
  }
  if (dishScore(dishId).n >= 2) await award('rated', PTS.rated, 'd' + dishId);
  renderAll();
  openDish(dishId);
}

function lastEaten(dishId){
  var best = null;
  for (var i = 0; i < DB.plan.length; i++){
    var p = DB.plan[i];
    if (p.dish_id === dishId && p.day <= todayISO() && (!best || p.day > best)) best = p.day;
  }
  return best;
}
function weeksSince(dayIso){
  if (!dayIso) return 999;
  return Math.floor((parseISO(todayISO()) - parseISO(dayIso)) / (86400000 * 7));
}

/* =====================================================================
   Liste d'épicerie. Une entrée "cuisiné" vaut une fournée complète,
   donc les quantités de la recette ne sont pas divisées: on cuisine le
   chili au complet et les restes servent un autre repas. Voir SPEC 3.
   ===================================================================== */

function norm(s){
  return String(s || '').toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').trim();
}
function pantrySet(){
  var m = {};
  for (var i = 0; i < DB.pantry.length; i++) m[norm(DB.pantry[i].item_fr)] = 1;
  return m;
}
function buildList(){
  var days = weekDays(), batches = [], i, s;
  for (i = 0; i < days.length; i++){
    for (s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (p && p.kind === 'cook' && p.dish_id) batches.push(p.dish_id);
    }
  }
  var pan = pantrySet(), agg = {};
  for (i = 0; i < batches.length; i++){
    var ings = DB.ings.filter(function(x){ return x.dish_id === batches[i]; });
    for (var j = 0; j < ings.length; j++){
      var g = ings[j];
      if (pan[norm(g.item_fr)]) continue;
      var key = norm(g.item_fr) + '|' + norm(g.unit);
      if (!agg[key]){
        agg[key] = { key:key, item_fr:g.item_fr, item_en:g.item_en, unit:g.unit || '',
                     store:g.store || 'Maxi', aisle:num(g.aisle), qty:0,
                     bulk_min:num(g.bulk_min), dishes:{} };
      }
      agg[key].qty += num(g.qty);
      agg[key].dishes[batches[i]] = 1;
    }
  }
  var out = [];
  for (var k in agg) out.push(agg[k]);
  return out;
}

/* =====================================================================
   Pointage. Coopératif, un seul score pour la maison, et rien ne retire
   de points. Voir SPEC section 5.
   ===================================================================== */

function hasScore(week, action, ref){
  for (var i = 0; i < DB.score.length; i++){
    var s = DB.score[i];
    if (s.week_start === week && s.action === action && String(s.ref || '') === String(ref || ''))
      return true;
  }
  return false;
}
async function award(action, points, ref, week){
  var w = week || wkISO();
  if (hasScore(w, action, ref)) return false;
  await ins('score', { week_start:w, action:action, points:points, ref:ref || null });
  toast(tf('gotpts', { n:points }), t('a_' + action));
  burst();
  renderBadge();
  return true;
}
function totalPts(){
  var s = 0;
  for (var i = 0; i < DB.score.length; i++) s += num(DB.score[i].points);
  return s;
}
function levelOf(pts){
  var l = 0;
  for (var i = 0; i < LVL.length; i++) if (pts >= LVL[i]) l = i;
  return l;
}

/* Un plat jamais vu au plan avant ce jour compte comme une nouveauté. */
async function scoreForDish(dishId, dayIso){
  var seen = false;
  for (var i = 0; i < DB.plan.length; i++){
    var p = DB.plan[i];
    if (p.dish_id === dishId && p.day < dayIso){ seen = true; break; }
  }
  if (!seen) await award('newdish', PTS.newdish, 'd' + dishId);
  var d = dishById(dishId);
  if (d && num(d.veg_serv) >= 2) await award('veg', PTS.veg, dayIso + '|' + dishId);
}

async function scoreWeek(){
  var days = weekDays(), wk = wkISO(), filled = 0, i, s;
  for (i = 0; i < days.length; i++){
    var dayProt = 0;
    for (s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (!p) continue;
      filled++;
      if (p.kind === 'cook') await award('home', PTS.home, days[i] + '|' + p.slot, wk);
      if (p.kind === 'cook' || p.kind === 'leftovers'){
        var d = dishById(p.dish_id);
        if (d) dayProt += num(d.protein_g) * myMult();
      }
    }
    var pt = num(ME && ME.protein_target);
    if (pt > 0 && dayProt >= pt) await award('prot', PTS.prot, days[i], wk);
  }
  if (filled >= 14) await award('plan', PTS.plan, 'w', wk);

  /* budget et épicerie propre, une fois la semaine terminée */
  var over = todayISO() > days[6];
  var bud = num(ME && ME.budget_week);
  var sh = weekShops(), tot = 0;
  for (i = 0; i < sh.length; i++) tot += num(sh[i].amount);
  if (over && bud > 0 && tot > 0 && tot <= bud) await award('budget', PTS.budget, 'w', wk);
  var items = buildList();
  if (items.length && sh.length){
    var allck = true;
    for (i = 0; i < items.length; i++) if (!isChecked(wk, items[i].key)) allck = false;
    if (allck) await award('nolist', PTS.nolist, 'w', wk);
  }
}

function statsOf(){
  var cnt = { plan:0, home:0, prot:0, veg:0, newdish:0, rated:0, budget:0, nolist:0 };
  var weeks = {};
  for (var i = 0; i < DB.score.length; i++){
    var s = DB.score[i];
    if (cnt[s.action] !== undefined) cnt[s.action]++;
    if (s.action === 'plan') weeks[s.week_start] = 1;
  }
  /* la plus longue suite de jours avec au moins un repas cuisiné */
  var cookDays = {};
  for (var j = 0; j < DB.plan.length; j++)
    if (DB.plan[j].kind === 'cook') cookDays[DB.plan[j].day] = 1;
  var keys = Object.keys(cookDays).sort(), run = 0, best = 0;
  for (var k = 0; k < keys.length; k++){
    if (k > 0 && iso(addDays(parseISO(keys[k - 1]), 1)) === keys[k]) run++;
    else run = 1;
    if (run > best) best = run;
  }
  var pts = totalPts();
  return { fullweeks:Object.keys(weeks).length, homeRun:best, protHits:cnt.prot,
           vegHits:cnt.veg, newTried:cnt.newdish, ratedBoth:cnt.rated,
           underBudget:cnt.budget, level:levelOf(pts), pts:pts };
}

/* Le poids penche vers ce qu'on n'a pas mangé depuis longtemps, c'est
   tout l'intérêt: ressortir les favoris oubliés. Voir SPEC section 4. */
function weightOf(d){
  var w = weeksSince(lastEaten(d.id));
  return 1 + Math.min(w, 8) * 1.4;
}
function weightedPick(pool, avoid){
  var cand = pool.filter(function(d){ return !avoid || avoid.indexOf(d.id) < 0; });
  if (!cand.length) cand = pool;
  if (!cand.length) return null;
  var tot = 0, i;
  for (i = 0; i < cand.length; i++) tot += weightOf(cand[i]);
  var r = Math.random() * tot;
  for (i = 0; i < cand.length; i++){ r -= weightOf(cand[i]); if (r <= 0) return cand[i]; }
  return cand[cand.length - 1];
}
function weightedSample(n){
  var pool = DB.dishes.slice(), out = [];
  while (out.length < n && pool.length){
    var d = weightedPick(pool, out.map(function(x){ return x.id; }));
    if (!d) break;
    out.push(d);
    pool = pool.filter(function(x){ return x.id !== d.id; });
  }
  return out;
}

const WCOL = ['#ff6fae','#3fe0b0','#ffd84d','#b48bff','#56c7ff','#ff9f68','#ff4f81','#7c5cff'];
let RSEG = [], RSLOT = null;

    stops.push(WCOL[i % WCOL.length] + ' ' + (i * seg) + 'deg ' + ((i + 1) * seg) + 'deg');
  var labels = '';
  for (i = 0; i < n; i++){

    '<p class="dim">' + esc(t('m_rouls')) + '</p>' +
    '<div class="wheelwrap"><div class="ptr"></div>' +

    labels + '<div class="hub">&#127858;</div></div></div>' +

    '<button class="btn am grow" id="spb" onclick="spin()">' + esc(t('spin')) + '</button></div>' +

    document.getElementById('spb').disabled = false;
  }, 4700);

/* ---- duel ---- */
let DUEL = [], DNEXT = [], DROUND = 1, DTOT = 1;
function openDuel(){
  if (DB.dishes.length < 2){ toast(t('noenough')); return; }
  var n = DB.dishes.length >= 8 ? 8 : (DB.dishes.length >= 4 ? 4 : 2);
  DUEL = weightedSample(n);
  DNEXT = [];
  DROUND = 1;
  DTOT = Math.round(Math.log(n) / Math.log(2));
  drawDuel();
}
function drawDuel(){
  if (!DUEL.length && !DNEXT.length){ closeSheet(); return; }
  if (DUEL.length === 1 && !DNEXT.length){
    var d = DUEL[0];
    burst();
    openSheet('<div class="sh"><h2>' + esc(t('winner')) + '</h2>' +
      '<button class="x" onclick="closeSheet()">&#10005;</button></div>' +
      '<div style="text-align:center"><div style="display:flex;justify-content:center;margin:9px 0">' +
      tile(d, 'xl') + '</div><div style="font:700 16px system-ui">' + esc(dname(d)) + '</div>' +
      '<div class="row" style="margin-top:13px">' +
      '<button class="btn pri grow" onclick="closeSheet();planThis(' + d.id + ')">' +
      esc(t('useit')) + '</button>' +
      '<button class="btn grow" onclick="openDuel()">' + esc(t('again')) + '</button></div></div>');
    return;
  }
  if (DUEL.length < 2){ DUEL = DNEXT.concat(DUEL); DNEXT = []; DROUND++; }
  var a = DUEL[0], b = DUEL[1];
  openSheet('<div class="sh"><h2>' + esc(t('duelttl')) + '</h2>' +
    '<button class="x" onclick="closeSheet()">&#10005;</button></div>' +
    '<p class="dim">' + esc(t('duelsub')) + '</p>' +

    '<div class="bracket">' + tf('round', { n:Math.min(DROUND, DTOT), t:DTOT }) + '</div>');
}
function fighter(d){
  return '<button class="fighter" onclick="duelPick(' + d.id + ')">' +
    '<div style="display:flex;justify-content:center">' + tile(d, 'lg') + '</div>' +
    '<div class="nm">' + esc(dname(d)) + '</div><div class="nu">' +
    (num(d.kcal) ? num(d.kcal) + ' ' + esc(t('u_kcal')) : '') + '</div></button>';
}
function duelPick(id){
  var w = dishById(id);
  DUEL = DUEL.slice(2);
  DNEXT.push(w);
  if (!DUEL.length && DNEXT.length === 1){ DUEL = DNEXT; DNEXT = []; }
  else if (DUEL.length < 2 && DNEXT.length >= 2){ DUEL = DNEXT; DNEXT = []; DROUND++; }
  drawDuel();
}

/* ---- semaine surprise ----
   Les restes du souper de la veille remplissent le dîner du lendemain
   quand le plat donne assez de portions. C'est ce que font les vrais
   gens, et ça n'ajoute rien à l'épicerie. */
async function surpriseWeek(){
  if (DB.dishes.length < 2){ toast(t('noenough')); return; }
  var days = weekDays(), recent = [], i;
  BULK = true;
  for (i = 0; i < days.length; i++){
    var sup = planFor(days[i], 'supper');
    if (!sup){
      var d = weightedPick(DB.dishes, recent.slice(-3));
      if (d){ await setPlan(days[i], 'supper', { dish_id:d.id, kind:'cook' }); recent.push(d.id); }
    } else if (sup.dish_id) recent.push(sup.dish_id);

    if (!planFor(days[i], 'lunch')){
      var prev = planFor(iso(addDays(WK, i - 1)), 'supper');
      var pd = prev && prev.dish_id ? dishById(prev.dish_id) : null;
      if (pd && num(pd.servings, 2) >= 4 && prev.kind === 'cook'){
        await setPlan(days[i], 'lunch', { dish_id:pd.id, kind:'leftovers' });
      } else {
        var q = DB.dishes.filter(function(x){ return (x.tags || []).indexOf('t_quick') >= 0; });
        var ld = weightedPick(q.length ? q : DB.dishes, recent.slice(-2));
        if (ld){ await setPlan(days[i], 'lunch', { dish_id:ld.id, kind:'cook' }); }
      }
    }
  }
  BULK = false;
  await scoreWeek();
  burst(60);
  renderAll();
}

/* Confettis au canvas, aucune librairie. */
let CVP = [], CVRUN = false;
function burst(n){
  var cv = document.getElementById('cv');
  cv.width = innerWidth; cv.height = innerHeight;
  var cols = ['#f59e0b','#22c55e','#60a5fa','#f43f5e','#a78bfa','#fbbf24'];
  var count = n || 40;
  for (var i = 0; i < count; i++){
    CVP.push({ x:innerWidth / 2 + (Math.random() - 0.5) * 120,
               y:innerHeight * 0.42,
               vx:(Math.random() - 0.5) * 11,
               vy:-7 - Math.random() * 9,
               r:3 + Math.random() * 4,
               a:1, rot:Math.random() * 6.3, vr:(Math.random() - 0.5) * 0.4,
               c:cols[Math.floor(Math.random() * cols.length)] });
  }
  if (!CVRUN){ CVRUN = true; requestAnimationFrame(tickCv); }
}
function tickCv(){
  var cv = document.getElementById('cv'), g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  for (var i = CVP.length - 1; i >= 0; i--){
    var p = CVP[i];
    p.vy += 0.34; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.a -= 0.009;
    if (p.a <= 0 || p.y > cv.height + 40){ CVP.splice(i, 1); continue; }
    g.save();
    g.globalAlpha = Math.max(0, p.a);
    g.translate(p.x, p.y);
    g.rotate(p.rot);
    g.fillStyle = p.c;
    g.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
    g.restore();
  }
  if (CVP.length) requestAnimationFrame(tickCv);
  else { CVRUN = false; g.clearRect(0, 0, cv.width, cv.height); }
}

async function saveMe(){
  var patch = {
    display_name:document.getElementById('mn').value.trim() || ME.display_name,
    kcal_target:num(document.getElementById('mk').value) || null,
    protein_target:num(document.getElementById('mp').value) || null,

    var r = await sb.from(TBL.members).update(patch).eq('id', ME.id);

  closeSheet();
  toast(t('saved'));
  await scoreWeek();
  renderAll();
}

(async function boot(){
  try { var sv = localStorage.getItem('bouffe_lang'); if (sv) L = sv; } catch(e){}
  applyLang();
  if (CONFIGURED && window.supabase){
    sb = supabase.createClient(SB_URL, SB_ANON);
    try {
      var s = await sb.auth.getSession();
      if (s.data && s.data.session){ await afterLogin(); return; }
    } catch(e){}
    showGate();

    var had = false;
    try { had = !!localStorage.getItem('bouffe_db'); } catch(e){}

})();

/* ---------------------------------------------------------------------
   Vérificateur de dictionnaires. Les deux langues doivent porter les
   mêmes clés, c'est une règle du projet. Il écrit à la console et ne
   touche jamais à l'affichage.
   --------------------------------------------------------------------- */
(function checkDict(){
  var a = Object.keys(T.fr), b = Object.keys(T.en);
  var miss = a.filter(function(k){ return b.indexOf(k) < 0; });
  var extra = b.filter(function(k){ return a.indexOf(k) < 0; });
  if (miss.length || extra.length)
    console.warn('Bouffe, dictionnaires désynchronisés', { manque_en:miss, en_trop:extra });
  else console.log('Bouffe, dictionnaires FR et EN synchronisés, ' + a.length + ' clés.');
})();
