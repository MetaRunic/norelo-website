<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Verger, carte des varietes</title>
<meta name="description" content="Carte des varietes du verger, section P2."/>
<link rel="icon" href="/favicon.png"/>
<style>
:root{--blue:#2563eb;--bl:#4fa3e8;--bp:#60a5fa;--dark:#070f2b;--d3:#0d1b3e;--gr:#64748b;
--pan:#0a1433;--line:rgba(255,255,255,.09);--txt:#e8eefc;--dim:#93a3c4;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--dark);color:var(--txt);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;}
header{position:sticky;top:0;z-index:20;background:rgba(7,15,43,.95);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;}
.bar{display:flex;align-items:center;gap:10px;}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;flex:1;}
h1 b{color:var(--bp);font-weight:700;}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;}
.lang button{background:none;border:0;color:var(--dim);font:600 12px/1 system-ui;
padding:7px 11px;cursor:pointer;}
.lang button.on{background:var(--blue);color:#fff;}
.note{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.45;}
.note b{color:var(--bl);font-weight:600;}
.legend{display:flex;gap:6px;overflow-x:auto;padding:9px 14px 11px;
border-bottom:1px solid var(--line);scrollbar-width:none;}
.legend::-webkit-scrollbar{display:none;}
.chip{display:flex;align-items:center;gap:6px;background:var(--pan);border:1px solid var(--line);
border-radius:999px;padding:6px 11px;font-size:12px;white-space:nowrap;cursor:pointer;
color:var(--dim);flex:none;transition:.12s;}
.chip.on{border-color:var(--bp);color:var(--txt);background:#122152;}
.chip .sw{width:9px;height:9px;border-radius:3px;flex:none;}
.chip .n{font-size:10.5px;opacity:.65;}
main{padding:14px 10px 40px;display:flex;justify-content:center;}
/* The block renders at about 1:2.7, matching the aerial view. Alleys are not
   drawn as stripes any more, the rows read from the canopies themselves, which
   keeps the grass correct whatever widths ROWCFG is given. */
.field{width:100%;max-width:420px;border-radius:10px;padding:9px 7px;
border:1px solid rgba(255,255,255,.14);
background-color:#24501a;
background-image:repeating-linear-gradient(0deg,
   rgba(255,255,255,.028) 0 2px, rgba(0,0,0,0) 2px 9px);
box-shadow:inset 0 0 50px rgba(0,0,0,.45);}
/* Layout is driven entirely by ROWCFG in the script. Each row carries its own
   width, start and end, so spacing varies per row the way it does in the field.
   Nothing here is a fixed grid. */
.plot{position:relative;width:100%;aspect-ratio:0.2854;}
/* The road is one SVG path so it can carry a rounded top and a Y at the south
   end. It scales with the plot because the viewBox matches the plot aspect, and
   every clearance is measured against this same path. */
.road{position:absolute;inset:0;z-index:0;pointer-events:none;}
.road path{fill:none;stroke:#a7a093;stroke-linecap:round;stroke-linejoin:round;}
.lm{position:absolute;z-index:2;border-radius:3px;background:#cfd3d8;
border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 3px rgba(0,0,0,.5);}
.lm.scale{background:#f3d27a;}
.edbtn{background:none;border:1px solid var(--line);border-radius:999px;color:var(--dim);
font:600 12px/1 system-ui;padding:7px 10px;cursor:pointer;flex:none;}
.edbtn.on{background:#b45309;border-color:#f59e0b;color:#fff;}
body.ed .t{cursor:grab;touch-action:none;}
body.ed .t.pick{outline:2px solid #fff;outline-offset:3px;z-index:6;}
/* the panel floats over the page, so the body is padded by its height while
   editing, otherwise the foot of the map sits under it and cannot be reached */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--d3);
border-top:1px solid var(--line);padding:9px 10px calc(10px + env(safe-area-inset-bottom));
display:none;box-shadow:0 -10px 30px rgba(0,0,0,.55);overflow-x:hidden;}
body.ed .panel{display:block;}
.panel.mini .prow:nth-child(n+2){display:none;}
.pmin{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;
color:var(--dim);font:600 13px/1 system-ui;padding:7px 11px;cursor:pointer;flex:none;}
.prow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.prow:last-child{margin-bottom:0;}
.ptag{font:600 12px system-ui;color:var(--bp);flex:none;}
.pb{background:var(--pan);border:1px solid var(--line);border-radius:7px;color:var(--txt);
font:600 12.5px/1 system-ui;padding:9px 8px;cursor:pointer;flex:none;min-width:36px;
white-space:nowrap;}
.pb:active{background:#1b2b63;}
.pb.wide{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.pb.warn{border-color:#b91c1c;color:#fca5a5;}
.phint{font:500 11px/1.4 system-ui;color:var(--dim);flex:1 1 100%;}
.lmlab{position:absolute;z-index:4;transform:translate(-50%,0);white-space:nowrap;
font:600 9.5px/1.25 system-ui;color:#e8eefc;text-shadow:0 1px 3px rgba(0,0,0,.95);
text-align:center;pointer-events:none;}
/* A tree as seen from above: an irregular crown rather than a disc, with light
   falling top left and foliage clumped unevenly across it. Four crown shapes keep
   a row from looking stamped out. Every measurement is a percentage, so a canopy
   drawn at any size carries the same shape and the same shading. */
.t{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;
cursor:pointer;aspect-ratio:1;z-index:1;
background-color:var(--c);
background-image:
 /* clumps of leaves catching the light */
 radial-gradient(circle at 36% 29%, rgba(255,255,255,.30), rgba(255,255,255,0) 21%),
 radial-gradient(circle at 57% 21%, rgba(255,255,255,.20), rgba(255,255,255,0) 17%),
 radial-gradient(circle at 23% 51%, rgba(255,255,255,.17), rgba(255,255,255,0) 19%),
 radial-gradient(circle at 64% 47%, rgba(255,255,255,.12), rgba(255,255,255,0) 16%),
 /* and the gaps between them */
 radial-gradient(circle at 71% 62%, rgba(0,0,0,.26), rgba(0,0,0,0) 23%),
 radial-gradient(circle at 44% 75%, rgba(0,0,0,.24), rgba(0,0,0,0) 21%),
 radial-gradient(circle at 79% 36%, rgba(0,0,0,.17), rgba(0,0,0,0) 19%),
 radial-gradient(circle at 30% 68%, rgba(0,0,0,.15), rgba(0,0,0,0) 18%),
 /* the crown as a whole: lit from the north west, edges falling away */
 radial-gradient(circle at 37% 31%, rgba(255,255,255,.20), rgba(255,255,255,0) 46%),
 radial-gradient(circle at 50% 48%, rgba(0,0,0,0) 50%, rgba(0,0,0,.40) 100%);
box-shadow:0 1px 2px rgba(0,0,0,.45);transition:opacity .12s;}
.t.c0{border-radius:58% 42% 55% 45% / 48% 56% 44% 52%;}
.t.c1{border-radius:46% 54% 42% 58% / 57% 45% 55% 43%;}
.t.c2{border-radius:53% 47% 61% 39% / 43% 53% 47% 57%;}
.t.c3{border-radius:62% 38% 47% 53% / 55% 46% 54% 45%;}
.t.dim{opacity:.12;}
.t.sel{z-index:3;outline:2px solid #fff;outline-offset:2px;}
.t.unc{border:1.5px dashed rgba(255,255,255,.8);}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--d3);
border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px 18px 24px;
transform:translateY(110%);transition:transform .22s ease;
box-shadow:0 -14px 40px rgba(0,0,0,.5);}
.sheet.up{transform:translateY(0);}
.sheet h2{margin:0 0 3px;font-size:21px;display:flex;align-items:center;gap:9px;}
.sheet h2 .sw{width:13px;height:13px;border-radius:4px;flex:none;}
.sub{color:var(--dim);font-size:12.5px;margin-bottom:13px;}
.rowi{display:flex;justify-content:space-between;padding:8px 0;
border-top:1px solid var(--line);font-size:13.5px;}
.rowi span:first-child{color:var(--dim);}
.warn{margin-top:11px;background:rgba(245,158,11,.11);border:1px solid rgba(245,158,11,.3);
color:#fcd34d;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;}
.close{margin-top:14px;width:100%;background:var(--blue);color:#fff;border:0;
border-radius:9px;padding:12px;font:600 14px system-ui;cursor:pointer;}
footer{text-align:center;color:var(--gr);font-size:11px;padding:0 14px 26px;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>Verger <b data-i="sec">P2</b></h1>
    <button class="edbtn" id="edb" onclick="toggleEdit()" data-i="ed_on"></button>
    <div class="lang">
      <button id="bfr" class="on" onclick="setLang('fr')">FR</button>
      <button id="ben" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="note" data-i="note"></div>
</header>

<div class="legend" id="legend"></div>

<main><div class="field"><div class="plot" id="plot">
  <svg class="road" id="road" viewBox="0 -128.6 1000 3501" preserveAspectRatio="none" aria-hidden="true"><path id="roadp"/></svg>
</div></div></main>

<footer><span data-i="foot"></span> &middot; v<span id="ver"></span></footer>

<div class="panel" id="panel">
  <div class="prow">
    <span class="ptag" id="pwho"></span>
    <button class="pmin" id="pmin" onclick="toggleMini()">&darr;</button>
    <span class="phint" data-i="ed_hint"></span>
  </div>
  <div class="prow">
    <span class="ptag" data-i="ed_move"></span>
    <button class="pb" onclick="nudge('mv',-1)">&uarr;</button>
    <button class="pb" onclick="nudge('mv',1)">&darr;</button>
    <span class="ptag" data-i="ed_x"></span>
    <button class="pb" onclick="nudge('x',-1)">&larr;</button>
    <button class="pb" onclick="nudge('x',1)">&rarr;</button>
  </div>
  <div class="prow">
    <span class="ptag" data-i="ed_size"></span>
    <button class="pb" onclick="nudge('k',-1)">&minus;</button>
    <button class="pb" onclick="nudge('k',1)">+</button>
    <span class="ptag" data-i="ed_space"></span>
    <button class="pb" onclick="nudge('sp',-1)">&minus;</button>
    <button class="pb" onclick="nudge('sp',1)">+</button>
  </div>
  <div class="prow">
    <span class="ptag" id="ptree"></span>
    <span class="ptag" data-i="ed_var"></span>
    <button class="pb" onclick="tweak('v',-1)">&larr;</button>
    <button class="pb" onclick="tweak('v',1)">&rarr;</button>
  </div>
  <div class="prow">
    <span class="ptag" data-i="ed_moveto"></span>
    <button class="pb" onclick="tweak('row',-1)">&larr;</button>
    <button class="pb" onclick="tweak('row',1)">&rarr;</button>
    <span class="ptag" data-i="ed_num"></span>
    <button class="pb" onclick="tweak('n',-1)">&minus;</button>
    <button class="pb" onclick="tweak('n',1)">+</button>
  </div>
  <div class="prow">
    <button class="pb wide" onclick="dupTree()" data-i="ed_dup"></button>
    <button class="pb wide warn" onclick="delTree()" data-i="ed_del"></button>
    <button class="pb wide" onclick="resetRow()" data-i="ed_reset"></button>
  </div>
  <div class="prow">
    <button class="pb wide" onclick="copyEdits()" id="pcopy" data-i="ed_copy"></button>
    <button class="pb wide warn" onclick="clearEdits()" data-i="ed_clear"></button>
  </div>
</div>

<div class="sheet" id="sheet">
  <h2><span class="sw" id="dsw"></span><span id="dname"></span></h2>
  <div class="sub" id="dnum"></div>
  <div class="rowi"><span data-i="lrow"></span><span id="drow"></span></div>
  <div class="rowi"><span data-i="lpos"></span><span id="dpos"></span></div>
  <div class="rowi"><span data-i="lsize"></span><span id="dsize"></span></div>
  <div class="warn" id="dwarn" style="display:none" data-i="unc"></div>
  <button class="close" onclick="closeSheet()" data-i="close"></button>
</div>

/* Corrections made in edit mode. Rows carry a start, an end, a sideways shift and
   a canopy scale. Trees carry an offset from where the layout put them, plus any
   that were added or removed. Kept in this browser until exported. */
var EDIT=false, SEL=null;
var OV={r:{},t:{},del:{},add:[]};
function loadOV(){
  try{ var j=localStorage.getItem('verger_edits'); if(j) OV=JSON.parse(j); }catch(e){}
  if(!OV.r)OV.r={}; if(!OV.t)OV.t={}; if(!OV.del)OV.del={}; if(!OV.add)OV.add=[];
}
function saveOV(){ try{ localStorage.setItem('verger_edits',JSON.stringify(OV)); }catch(e){} }
function rowOv(r){ if(!OV.r[r]) OV.r[r]={s:null,e:null,dx:0,k:1,sp:1}; return OV.r[r]; }

  var above={}, below={};
  for(row in dia){
    var rh=dia[row]/2/ASPECT, pr2=roadAt(g.cx[row-1]);
    var a=roadOverAt(g.cx[row-1])-CLEAR-rh;
    if(a<rh-EXT_T) a=rh-EXT_T;        /* may reach into the margin above the block */
    above[row]=a;
    var un=roadUnderAt(g.cx[row-1]);
    var bl=(un>0?un:pr2[1])+CLEAR+rh;
    var floor=1+EXT_B-rh;
    below[row]=(bl>floor)?floor:bl;
  }
  return {g:g, lim:lim, band:band, dia:dia, above:above, below:below};
}

function buildMap(){
  var L=layout(), g=L.g, i;
  var rp=document.getElementById('roadp');
  rp.setAttribute('d', ROAD_D);
  rp.setAttribute('stroke-width', ROAD_W);

  var plot=document.getElementById('plot');
  var frag=document.createDocumentFragment();
  for(i=0;i<LANDMARKS.length;i++){
    var m=LANDMARKS[i];
    var el=document.createElement('div');
    el.className='lm'+(m.k==='scale'?' scale':'');
    el.style.left=(m.x0*100)+'%';
    el.style.width=((m.x1-m.x0)*100)+'%';
    el.style.top=(mapY(m.y0)*100)+'%';
    el.style.height=((mapY(m.y1)-mapY(m.y0))*100)+'%';
    frag.appendChild(el);
    if(!m.nolab){
      var lb=document.createElement('div');
      lb.className='lmlab'; lb.setAttribute('data-i','lm_'+m.k);
      lb.style.left=((m.lx!==undefined?m.lx:(m.x0+m.x1)/2)*100)+'%';
      lb.style.top=(mapY(m.y1)*100+m.lo)+'%';
      frag.appendChild(lb);
    }
  }
  for(var r=1;r<=11;r++){
    var list=rowList(r), bd=L.band[r], n=list.length, j;
    for(j=0;j<n;j++){
      var it=list[j];
      var y=(n>1)? bd[0]+(j/(n-1))*(bd[1]-bd[0]) : (bd[0]+bd[1])/2;
      frag.appendChild(treeEl(it.k,r,it.v,it.u,g.cx[r-1],y,L.dia[r],it.i));
    }
  }
  /* the few that stand on the far side of the road keep their own placement */
  for(i=0;i<DATA.t.length;i++){
    var tr=DATA.t[i], row=tr[0], key=row+'_'+tr[1];
    if(OV.del[key]) continue;
    var inf=treeInfo(key); if(!inf) continue;
    if(isAbove(row,tr[1]))
      frag.appendChild(treeEl(key,row,inf.v,inf.u,g.cx[row-1],L.above[row],L.dia[row],i));
    else if(isBelow(row,tr[1]))
      frag.appendChild(treeEl(key,row,inf.v,inf.u,g.cx[row-1],L.below[row],L.dia[row],i));
  }
  plot.appendChild(frag);
}

/* One tree on the map. In edit mode it is draggable and selectable instead of
   opening its details. */
function treeEl(key,row,vi,unc,bx,by,diam,idx){
  var o=OV.t[key]||{dx:0,dy:0};
  var b=document.createElement('button');
  b.className='t c'+crown(key)+(unc?' unc':'')+(SEL===key?' pick':'');
  b.style.setProperty('--c',COLOR[DATA.v[vi]]||'#888');
  b.style.left=((bx+o.dx)*100)+'%';
  b.style.top=(mapY(by+o.dy)*100)+'%';
  b.style.width=(diam*100)+'%';
  b.setAttribute('data-k',key);
  b.setAttribute('data-bx',bx);
  b.setAttribute('data-by',by);
  if(idx!==null && idx!==undefined) b.setAttribute('data-x',idx);
  if(EDIT) attachDrag(b,key); else b.onclick=mkOpen(idx);
  return b;
}
function mkOpen(n){ return function(){ if(n!==null&&n!==undefined) openSheet(n); }; }
/* which of the four crowns a tree wears, fixed by its key so it never changes
   when the map is redrawn */
function crown(key){
  var h=0,i;
  for(i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))&1023;
  return h&3;
}

function attachDrag(el,key){
  el.addEventListener('pointerdown',function(ev){
    ev.preventDefault(); ev.stopPropagation();
    SEL=key; markPick(); refreshPanel();
    var plot=document.getElementById('plot'), r=plot.getBoundingClientRect();
    var sx=ev.clientX, sy=ev.clientY;
    var bx=parseFloat(el.getAttribute('data-bx')), by=parseFloat(el.getAttribute('data-by'));
    var o=treeOv(key), ox=o.dx, oy=o.dy, moved=false;
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
    function mv(e){
      moved=true;
      o.dx=ox+(e.clientX-sx)/r.width;
      o.dy=oy+((e.clientY-sy)/r.height)*EXT_TOT;
      el.style.left=((bx+o.dx)*100)+'%';
      el.style.top=(mapY(by+o.dy)*100)+'%';
      if(key.charAt(0)==='a'){ var a=OV.add[+key.slice(1)]; a.x=bx+o.dx; a.y=by+o.dy; }
    }
    function up(){
      el.removeEventListener('pointermove',mv);
      el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      if(!moved){ o.dx=ox; o.dy=oy; }
      saveOV();
    }
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
}

function markPick(){
  var n=document.querySelectorAll('.t'), i;
  for(i=0;i<n.length;i++){
    var k=n[i].getAttribute('data-k');
    n[i].className=n[i].className.replace(/ ?pick/,'')+(SEL===k?' pick':'');
  }
}
function redraw(){
  var plot=document.getElementById('plot');
  var n=plot.querySelectorAll('.t,.lm,.lmlab'), i;
  for(i=0;i<n.length;i++) n[i].parentNode.removeChild(n[i]);
  buildMap(); buildLegend(); paint();
  var note=document.querySelector('[data-i="note"]');
  if(note) note.innerHTML=t('note').replace('{n}',liveTotal());
}
var MINI=false;
function toggleMini(){
  MINI=!MINI;
  document.getElementById('panel').className='panel'+(MINI?' mini':'');
  document.getElementById('pmin').innerHTML=MINI?'&uarr;':'&darr;';
  panelSpace();
}
function panelSpace(){
  var el=document.getElementById('panel');
  document.body.style.paddingBottom = EDIT ? (el.offsetHeight+14)+'px' : '';
}
function toggleEdit(){
  EDIT=!EDIT; SEL=null;
  document.body.className=EDIT?'ed':'';
  document.getElementById('edb').className='edbtn'+(EDIT?' on':'');
  document.getElementById('edb').setAttribute('data-i',EDIT?'ed_off':'ed_on');
  document.getElementById('edb').innerHTML=t(EDIT?'ed_off':'ed_on');
  if(EDIT) closeSheet();
  redraw(); refreshPanel(); panelSpace();
}
addEventListener('resize',panelSpace);
function refreshPanel(){
  panelSpace();
  var w=document.getElementById('pwho'), r=selRow();
  w.textContent = r ? (t('ed_row')+' '+r+'  ('+rowCount(r)+')') : t('ed_none');
  var inf=SEL?treeInfo(SEL):null;
  document.getElementById('ptree').textContent =
    inf ? (vname(DATA.v[inf.v])+(inf.num?' '+inf.num:'')) : '';
}
/* the selected tree itself: which row it belongs to, which variety it is, and
   its number, all of which go stale as soon as trees are added or removed */
function tweak(what,dir){
  if(!SEL) return;
  var inf=treeInfo(SEL); if(!inf) return;
  if(SEL.charAt(0)==='a'){
    var a=OV.add[+SEL.slice(1)];
    if(what==='v') a.v=(a.v+dir+DATA.v.length)%DATA.v.length;
    if(what==='n') a.n=Math.max(0,(a.n||0)+dir);
    if(what==='row'){ a.r=Math.min(11,Math.max(1,a.r+dir)); a.after=null; }
  }else{
    var o=treeOv(SEL);
    if(what==='v') o.v=(inf.v+dir+DATA.v.length)%DATA.v.length;
    if(what==='n') o.n=Math.max(0,inf.num+dir);
    if(what==='row') o.row=Math.min(11,Math.max(1,inf.row+dir));
  }
  saveOV(); redraw(); refreshPanel();
}

function nudge(what,dir){
  var r=selRow(); if(!r) return;
  var o=rowOv(r), L=layout();
  if(what==='mv'){
    var cs=(o.s===null||o.s===undefined)?L.band[r][0]:o.s;
    var ce=(o.e===null||o.e===undefined)?L.band[r][1]:o.e;
    o.s=cs+dir*0.007; o.e=ce+dir*0.007;
  }
  if(what==='x'){ o.dx=(o.dx||0)+dir*0.004; }
  if(what==='k'){ o.k=Math.max(0.3,Math.min(2.2,(o.k||1)+dir*0.06)); }
  if(what==='sp'){ o.sp=Math.max(0.25,Math.min(1.6,(o.sp||1)+dir*0.035)); }
  saveOV(); redraw(); refreshPanel();
}
function dupTree(){
  if(!SEL) return;
  var r=selRow(); if(!r) return;
  var vi=0, i;
  if(SEL.charAt(0)==='a') vi=OV.add[+SEL.slice(1)].v;
  else { for(i=0;i<DATA.t.length;i++){ if(DATA.t[i][0]+'_'+DATA.t[i][1]===SEL){ vi=DATA.t[i][2]; break; } } }
  OV.add.push({r:r,v:vi,after:SEL});
  SEL='a'+(OV.add.length-1);
  saveOV(); redraw(); refreshPanel();
}
function delTree(){
  if(!SEL) return;
  if(SEL.charAt(0)==='a') OV.add.splice(+SEL.slice(1),1);
  else OV.del[SEL]=1;
  SEL=null; saveOV(); redraw(); refreshPanel();
}
function resetRow(){
  var r=selRow(); if(!r) return;
  delete OV.r[r];
  var k; for(k in OV.t){ if(k.charAt(0)!=='a' && +k.split('_')[0]===r) delete OV.t[k]; }
  for(k in OV.del){ if(+k.split('_')[0]===r) delete OV.del[k]; }
  OV.add=OV.add.filter(function(a){ return a.r!==r; });
  SEL=null; saveOV(); redraw(); refreshPanel();
}
function copyEdits(){
  var txt=JSON.stringify(OV);
  var done=function(){ var b=document.getElementById('pcopy');
    b.textContent=t('ed_copied'); setTimeout(function(){ b.textContent=t('ed_copy'); },1400); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){prompt(t('ed_copy'),txt);}); }
  else prompt(t('ed_copy'),txt);
}
function clearEdits(){
  OV={r:{},t:{},del:{},add:[]}; SEL=null; saveOV(); redraw(); refreshPanel();
}

function paint(){
  var n=document.querySelectorAll('.t');
  for(var i=0;i<n.length;i++){
    var k=n[i].getAttribute('data-k'), inf=treeInfo(k);
    if(!inf) continue;
    var v=DATA.v[inf.v];
    n[i].className='t c'+crown(k)+(inf.u?' unc':'')+
      (filter&&v!==filter?' dim':'')+(sel!==null&&sel===inf.idx?' sel':'')+
      (SEL===k?' pick':'');
  }
}

function openSheet(idx){
  sel=idx;
  var tr=DATA.t[idx], inf=treeInfo(tr[0]+'_'+tr[1])||{v:tr[2],num:tr[3],row:tr[0]};
  var v=DATA.v[inf.v];
  document.getElementById('dsw').style.background=COLOR[v]||'#888';
  document.getElementById('dname').textContent=vname(v);
  document.getElementById('dnum').textContent = inf.num? (t('tree')+' '+vname(v)+' '+inf.num) : t('untitled');
  document.getElementById('drow').textContent=inf.row;
  document.getElementById('dpos').textContent=tr[1];
  document.getElementById('dsize').textContent = tr[4]===1?t('petit'):tr[4]===2?t('moyen'):t('std');
  document.getElementById('dwarn').style.display = tr[5]?'block':'none';
  document.getElementById('sheet').className='sheet up';
  paint();
}

function closeSheet(){
  sel=null;
  document.getElementById('sheet').className='sheet';
  paint();
}

document.getElementById('ver').textContent=APP_VERSION;
loadOV();
buildMap();
try{var sv=localStorage.getItem('verger_lang');}catch(e){var sv=null;}
setLang(sv==='en'?'en':'fr');
paint();
refreshPanel();
</script>
