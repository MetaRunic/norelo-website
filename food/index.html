<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Bouffe</title>
<meta name="robots" content="noindex,nofollow"/>
<meta name="description" content="Planificateur de repas prive."/>
<link rel="icon" href="/favicon.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   Bouffe. Page privee de la maison, donc le ton est volontairement plus
   sucre que le site vitrine: fond myrtille, accents bonbon, boutons
   epais qui s'enfoncent, autocollants legerement de travers.
   Les noms de classes sont ceux du script, ne pas les renommer.
   ===================================================================== */
:root{
 --dark:#120a26;--pan:#1d1138;--d3:#271750;--deep:#0c0618;
 --line:rgba(255,255,255,.10);--txt:#f4eeff;--dim:#a99bd0;
 --pink:#ff6fae;--peach:#ff9f68;--mint:#3fe0b0;--butter:#ffd84d;
 --lilac:#b48bff;--sky:#56c7ff;--berry:#ff4f81;
 /* alias gardes pour que rien ne casse */
 --blue:#7c5cff;--bl:#56c7ff;--bp:#b48bff;--gr:#a99bd0;
 --grn:#3fe0b0;--amb:#ffd84d;--rose:#ff4f81;--vio:#b48bff;
 --r:18px;--r2:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;color:var(--txt);overflow-x:hidden;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 background:var(--dark);
 /* un semis de points, pour que le fond ne soit pas une surface morte */
 background-image:radial-gradient(rgba(180,139,255,.085) 1px,transparent 1px),
   radial-gradient(circle at 12% -8%,rgba(255,111,174,.16),transparent 46%),
   radial-gradient(circle at 92% 4%,rgba(63,224,176,.12),transparent 42%);
 background-size:19px 19px,auto,auto;
 background-attachment:fixed;}
button{font-family:inherit;}
a{color:var(--lilac);}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:30;
 background:linear-gradient(120deg,rgba(39,23,80,.97),rgba(18,10,38,.97));
 backdrop-filter:blur(10px);border-bottom:2px solid rgba(180,139,255,.28);}
.bar{display:flex;align-items:center;gap:9px;padding:11px 13px 9px;}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.4px;flex:1;
 display:flex;align-items:center;gap:8px;}
h1 b{font-weight:800;
 background:linear-gradient(92deg,var(--pink),var(--butter),var(--mint),var(--sky),var(--pink));
 background-size:320% 100%;-webkit-background-clip:text;background-clip:text;
 -webkit-text-fill-color:transparent;animation:pan 11s linear infinite;}
@keyframes pan{to{background-position:320% 0;}}
h1 span:first-child{display:inline-block;font-size:22px;animation:wig 3.6s ease-in-out infinite;}
@keyframes wig{0%,72%,100%{transform:rotate(0) scale(1);}
 80%{transform:rotate(-13deg) scale(1.13);}90%{transform:rotate(11deg) scale(1.13);}}
.lang{display:flex;border:2px solid rgba(255,255,255,.14);border-radius:999px;
 overflow:hidden;flex:none;background:var(--deep);}
.lang button{background:none;border:0;color:var(--dim);font:800 12px/1 system-ui;
 padding:7px 11px;cursor:pointer;letter-spacing:.3px;}
.lang button.on{background:linear-gradient(135deg,var(--pink),var(--berry));color:#fff;}
.who{background:var(--deep);border:2px solid rgba(255,255,255,.14);border-radius:999px;
 color:var(--txt);font:800 11.5px/1 system-ui;padding:7px 11px;cursor:pointer;flex:none;
 max-width:98px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who:active{transform:scale(.94);}

/* la pastille de niveau: c'est un jeu, donc elle brille un peu */
.lvl{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.lvlbadge{display:flex;align-items:center;gap:5px;
 background:linear-gradient(135deg,var(--butter),var(--peach));
 border:0;border-radius:999px;padding:6px 12px;font:900 11.5px/1 system-ui;
 color:#44210a;flex:none;box-shadow:0 3px 0 #b9741f,0 6px 16px rgba(255,159,104,.35);
 transform:rotate(-2deg);}
.lvlbadge span:first-child{animation:tw 2.4s ease-in-out infinite;}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);}50%{transform:scale(1.26) rotate(19deg);}}
.xpwrap{flex:1;height:11px;background:var(--deep);border:2px solid rgba(255,255,255,.12);
 border-radius:999px;overflow:hidden;}
.xpbar{height:100%;width:0;border-radius:999px;
 background:linear-gradient(90deg,var(--mint),var(--butter),var(--peach));
 background-size:200% 100%;animation:pan 5s linear infinite;
 transition:width .65s cubic-bezier(.34,1.56,.64,1);
 box-shadow:0 0 12px rgba(255,216,77,.5);}
.xptxt{font:800 11px/1 system-ui;color:var(--dim);flex:none;}

/* ---------- onglets, en bas, la ou se trouve le pouce ----------
   Cinq cibles pleine hauteur plutot qu'une rangee de pastilles qui
   defilait hors de l'ecran. Rien a viser du bout du doigt en haut. */
nav{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;
 background:rgba(18,10,38,.97);backdrop-filter:blur(12px);
 border-top:2px solid rgba(180,139,255,.25);
 padding:7px 4px calc(7px + env(safe-area-inset-bottom));}
nav button{flex:1;background:none;border:0;cursor:pointer;color:var(--dim);
 display:flex;flex-direction:column;align-items:center;gap:3px;
 padding:7px 2px;border-radius:14px;font:800 10px/1.1 system-ui;
 position:relative;transition:color .15s,background .15s;}
nav button .ic{font-size:21px;line-height:1;display:block;
 transition:transform .22s cubic-bezier(.34,1.56,.64,1);}
nav button:active .ic{transform:scale(.84);}
nav button.on{color:var(--pink);background:rgba(255,111,174,.12);}
nav button.on .ic{transform:translateY(-2px) scale(1.13);}
nav .cnt{position:absolute;top:2px;right:50%;margin-right:-24px;
 background:var(--berry);color:#fff;border-radius:999px;
 font:900 9.5px/1 system-ui;padding:3px 5px;min-width:16px;text-align:center;
 box-shadow:0 0 0 2px var(--dark);}
nav .cnt:empty{display:none;}

/* la pastille de niveau vit dans l'en-tete, le reste du jeu dans son onglet */
.lvlchip{display:flex;align-items:center;gap:4px;flex:none;cursor:pointer;
 background:linear-gradient(135deg,var(--butter),var(--peach));border:0;
 border-radius:999px;padding:6px 11px;font:900 12px/1 system-ui;color:#44210a;
 box-shadow:0 3px 0 #b9741f;}
.lvlchip:active{transform:translateY(3px);box-shadow:none;}

main{padding:13px 11px 108px;max-width:1120px;margin:0 auto;}
section{display:none;}
section.on{display:block;animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.99);}}

/* ---------- blocs ---------- */
.pan{background:linear-gradient(165deg,var(--pan),rgba(18,10,38,.72));
 border:2px solid rgba(255,255,255,.09);border-radius:var(--r2);
 padding:15px;margin-bottom:12px;box-shadow:0 7px 0 rgba(0,0,0,.26);}
.ttl{font:900 13.5px/1 system-ui;letter-spacing:-.2px;margin-bottom:10px;
 display:flex;align-items:center;gap:7px;}
.ttl .sp{margin-left:auto;font:800 11.5px/1 system-ui;color:var(--dim);}
.dim{color:var(--dim);font-size:12.5px;line-height:1.55;}

/* boutons epais, avec une ombre dure qui s'ecrase au doigt */
.btn{background:var(--d3);border:2px solid rgba(255,255,255,.12);border-radius:14px;
 color:var(--txt);font:800 12.5px/1 system-ui;padding:11px 13px;cursor:pointer;
 box-shadow:0 4px 0 rgba(0,0,0,.4);
 transition:transform .12s,box-shadow .12s;}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.4);}
.btn.pri{background:linear-gradient(135deg,var(--lilac),#7c5cff);border-color:transparent;
 color:#fff;box-shadow:0 4px 0 #4a2fb8;}
.btn.gr{background:linear-gradient(135deg,var(--mint),#1fb98c);border-color:transparent;
 color:#06281e;box-shadow:0 4px 0 #14805f;}
.btn.am{background:linear-gradient(135deg,var(--butter),var(--peach));border-color:transparent;
 color:#44210a;box-shadow:0 4px 0 #b9741f;}
.btn.wn{background:linear-gradient(135deg,#ff6f8e,var(--berry));border-color:transparent;
 color:#fff;box-shadow:0 4px 0 #a81f47;}
.btn.sm{padding:8px 10px;font-size:11.5px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.4);}
.btn.sm:active{transform:translateY(3px);}
.btn[disabled]{opacity:.42;cursor:default;transform:none;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.grow{flex:1 1 0;min-width:0;}
input,select,textarea{background:var(--deep);border:2px solid rgba(255,255,255,.12);
 border-radius:13px;color:var(--txt);font:600 13px/1.3 system-ui;padding:11px 12px;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);
 box-shadow:0 0 0 4px rgba(255,111,174,.17);}
label{display:block;font:800 11px/1 system-ui;color:var(--dim);margin:0 0 5px;
 letter-spacing:.2px;}
.fld{margin-bottom:10px;}
.half{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.third{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}

/* ---------- bandeau de saison ---------- */
.seas{display:flex;gap:9px;align-items:center;
 background:linear-gradient(100deg,rgba(63,224,176,.17),rgba(29,17,56,.5));
 border:2px dashed rgba(63,224,176,.45);border-radius:var(--r2);
 padding:11px 13px;margin-bottom:12px;}
.seas .ic{font-size:22px;flex:none;animation:bob 2.9s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg);}
 50%{transform:translateY(-5px) rotate(6deg);}}
.seas .tx{font:700 12px/1.5 system-ui;color:#b9f5e2;}
.seas .tx b{color:#fff;}

/* ---------- semaine ---------- */
.wknav{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.wknav .lbl{flex:1;font:900 14px/1.2 system-ui;text-align:center;letter-spacing:-.2px;}
.wknav .lbl span{display:block;font:700 11px/1.3 system-ui;color:var(--dim);margin-top:3px;}
.days{display:grid;gap:11px;grid-template-columns:1fr;}
@media(min-width:900px){.days{grid-template-columns:repeat(7,1fr);gap:8px;}}
.day{background:linear-gradient(170deg,var(--pan),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.08);border-radius:var(--r2);overflow:hidden;
 box-shadow:0 6px 0 rgba(0,0,0,.24);}
.day.today{border-color:var(--pink);box-shadow:0 6px 0 #a8295c,0 0 26px rgba(255,111,174,.3);}
.dhd{display:flex;align-items:center;gap:7px;padding:10px 12px;
 background:rgba(255,255,255,.045);border-bottom:2px solid rgba(255,255,255,.07);}
.dhd .dn{font:900 12.5px/1 system-ui;letter-spacing:.2px;}
.dhd .dd{font:800 11px/1 system-ui;color:var(--dim);
 background:var(--deep);border-radius:999px;padding:4px 7px;}
.dhd .kc{margin-left:auto;font:800 10.5px/1 system-ui;color:var(--butter);}
.day.today .dhd .dn{color:var(--pink);}
.slot{padding:9px 10px;border-bottom:1px dashed rgba(255,255,255,.08);}
.slot:last-child{border-bottom:0;}
.sl{font:900 9.5px/1 system-ui;color:var(--lilac);letter-spacing:1.1px;
 text-transform:uppercase;margin-bottom:7px;}
.empty{display:flex;gap:6px;}
.empty button{flex:1;background:rgba(255,255,255,.035);
 border:2px dashed rgba(180,139,255,.42);border-radius:14px;color:var(--dim);
 font:800 11.5px/1 system-ui;padding:12px 4px;cursor:pointer;transition:transform .14s,color .14s;}
.empty button:active{transform:scale(.93);color:var(--pink);border-color:var(--pink);}

/* un repas planifie. la tuile est dessinee, jamais une photo, donc elle
   doit porter son propre caractere: une forme de galet irreguliere */
.meal{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%;
 background:none;border:0;padding:0;text-align:left;color:inherit;}
.meal:active{transform:scale(.975);}
.tile{width:48px;height:48px;flex:none;position:relative;
 display:flex;align-items:center;justify-content:center;font-size:22px;
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.4);
 overflow:hidden;border-radius:46% 54% 52% 48% / 50% 46% 54% 50%;}
.tile.s0{border-radius:58% 42% 54% 46% / 48% 56% 44% 52%;}
.tile.s1{border-radius:44% 56% 41% 59% / 58% 44% 56% 42%;}
.tile.s2{border-radius:53% 47% 62% 38% / 42% 54% 46% 58%;}
.tile.s3{border-radius:63% 37% 47% 53% / 56% 45% 55% 44%;}
.tile::after{content:"";position:absolute;inset:0;
 background:radial-gradient(circle at 29% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 56%);}
.tile span{position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));}
.tile.lg{width:64px;height:64px;font-size:30px;}
.tile.xl{width:96px;height:96px;font-size:45px;}
.day .tile{animation:fl 4.2s ease-in-out infinite;}
.day:nth-child(2n) .tile{animation-delay:-1.1s;}
.day:nth-child(3n) .tile{animation-delay:-2.3s;}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0);}
 50%{transform:translateY(-3px) rotate(2.5deg);}}
.mi{flex:1;min-width:0;}
.mi .nm{font:800 12.5px/1.32 system-ui;overflow:hidden;text-overflow:ellipsis;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.mi .mt{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}

/* autocollants, legerement de travers */
.pill{font:900 9.5px/1 system-ui;padding:4px 7px;border-radius:999px;
 background:rgba(180,139,255,.2);color:#d9c8ff;border:1.5px solid rgba(180,139,255,.45);
 display:inline-block;transform:rotate(-1.6deg);}
.pill.g{background:rgba(63,224,176,.2);color:#b9f5e2;border-color:rgba(63,224,176,.5);
 transform:rotate(1.4deg);}
.pill.a{background:rgba(255,216,77,.2);color:#ffeaa8;border-color:rgba(255,216,77,.5);
 transform:rotate(-1.1deg);}
.pill.r{background:rgba(255,79,129,.2);color:#ffc7d6;border-color:rgba(255,79,129,.5);}
.pill.v{background:rgba(86,199,255,.18);color:#bfe9ff;border-color:rgba(86,199,255,.45);
 transform:rotate(1.2deg);}
.kind{font:800 10px/1 system-ui;color:var(--peach);margin-top:5px;}

/* ---------- bibliotheque ---------- */
.dishes{display:grid;gap:10px;grid-template-columns:1fr;}
@media(min-width:620px){.dishes{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.dishes{grid-template-columns:1fr 1fr 1fr;}}
.card{background:linear-gradient(165deg,var(--pan),rgba(18,10,38,.7));
 border:2px solid rgba(255,255,255,.09);border-radius:var(--r2);
 padding:12px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;
 text-align:left;color:inherit;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.26);
 transition:transform .14s,box-shadow .14s;}
.card:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,.26);}
.card .nm{font:900 13px/1.32 system-ui;}
.card .nu{font:700 10.5px/1 system-ui;color:var(--dim);margin-top:6px;}
.stars{display:flex;gap:2px;align-items:center;margin-top:6px;}
.stars i{font-style:normal;font-size:12px;color:#4a3a72;}
.stars i.f{color:var(--butter);filter:drop-shadow(0 0 4px rgba(255,216,77,.6));}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:11px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.chip{background:var(--pan);border:2px solid rgba(255,255,255,.1);border-radius:999px;
 color:var(--dim);font:800 11.5px/1 system-ui;padding:9px 12px;cursor:pointer;flex:none;
 white-space:nowrap;transition:transform .14s;}
.chip:active{transform:scale(.92);}
.chip.on{background:linear-gradient(135deg,var(--mint),#1fb98c);color:#06281e;
 border-color:transparent;box-shadow:0 3px 0 #14805f;}

/* ---------- epicerie ---------- */
.store{margin-bottom:12px;border:2px solid rgba(255,255,255,.09);
 border-radius:var(--r2);overflow:hidden;
 background:linear-gradient(170deg,var(--pan),rgba(18,10,38,.7));
 box-shadow:0 6px 0 rgba(0,0,0,.24);}
.shd{display:flex;align-items:center;gap:8px;padding:12px 13px;
 background:linear-gradient(100deg,rgba(180,139,255,.18),transparent);
 border-bottom:2px solid rgba(255,255,255,.08);}
.shd .sn{font:900 13.5px/1 system-ui;letter-spacing:-.2px;}
.shd .sc{margin-left:auto;font:800 11px/1 system-ui;color:var(--dim);
 background:var(--deep);border-radius:999px;padding:5px 9px;}
.li{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;
 border-bottom:1px dashed rgba(255,255,255,.07);}
.li:last-child{border-bottom:0;}
.li .bx{width:23px;height:23px;border-radius:8px;
 border:2.5px solid rgba(180,139,255,.5);flex:none;display:flex;
 align-items:center;justify-content:center;font-size:13px;color:#06281e;
 transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .16s;}
.li.ck .bx{background:linear-gradient(135deg,var(--mint),#1fb98c);
 border-color:var(--mint);transform:rotate(-9deg) scale(1.1);}
.li.ck .it{opacity:.38;text-decoration:line-through;}
.li .it{flex:1;font:700 12.5px/1.4 system-ui;}
.li .qt{font:900 12.5px/1 system-ui;color:var(--butter);flex:none;}
.li .ai{font:800 9.5px/1 system-ui;color:var(--lilac);flex:none;opacity:.8;}
.bulk{font:800 9.5px/1.3 system-ui;color:var(--peach);margin-top:3px;}

/* ---------- jeu ---------- */
.modes{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
.mode{background:linear-gradient(160deg,var(--d3),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.1);border-radius:var(--r2);
 padding:16px 11px;cursor:pointer;text-align:center;color:inherit;
 box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .14s,box-shadow .14s;}
.mode:active{transform:translateY(5px);box-shadow:0 0 0 rgba(0,0,0,.3);}
.mode .ic{font-size:31px;display:inline-block;animation:bob 3.4s ease-in-out infinite;}
.mode:nth-child(2n) .ic{animation-delay:-.9s;}
.mode .nm{font:900 13px/1.2 system-ui;margin-top:8px;}
.mode .ds{font:600 10.5px/1.45 system-ui;color:var(--dim);margin-top:5px;}

/* la roue est un degrade conique, donc ni svg ni librairie */
.wheelwrap{position:relative;width:min(84vw,330px);margin:16px auto 0;}
.wheel{width:100%;aspect-ratio:1;border-radius:50%;position:relative;
 border:5px solid var(--d3);
 box-shadow:0 14px 42px rgba(0,0,0,.6),inset 0 0 0 8px rgba(255,255,255,.07),
  0 0 0 3px rgba(255,216,77,.45);
 transition:transform 4.6s cubic-bezier(.12,.72,.03,1);}
.wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:27%;height:27%;border-radius:50%;background:var(--d3);
 border:3px solid var(--butter);display:flex;align-items:center;justify-content:center;
 font-size:25px;box-shadow:0 0 22px rgba(255,216,77,.45);}
.ptr{position:absolute;left:50%;top:-13px;transform:translateX(-50%);
 width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
 border-top:22px solid var(--pink);z-index:3;
 filter:drop-shadow(0 3px 5px rgba(0,0,0,.7));}
.wlbl{position:absolute;font:900 9.5px/1 system-ui;color:#fff;
 text-shadow:0 1px 4px rgba(0,0,0,.95);pointer-events:none;white-space:nowrap;
 transform-origin:0 50%;}

/* duel */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
.duel .vs{font:900 17px/1 system-ui;
 background:linear-gradient(135deg,var(--pink),var(--butter));
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 animation:tw 1.7s ease-in-out infinite;}
.fighter{background:linear-gradient(160deg,var(--d3),rgba(18,10,38,.76));
 border:2px solid rgba(255,255,255,.1);border-radius:var(--r2);
 padding:14px 10px;cursor:pointer;text-align:center;color:inherit;
 box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .13s,box-shadow .13s,border-color .13s;}
.fighter:active{transform:translateY(5px) scale(.98);box-shadow:0 0 0 rgba(0,0,0,.3);
 border-color:var(--pink);}
.fighter .nm{font:900 12px/1.3 system-ui;margin-top:9px;}
.fighter .nu{font:800 10px/1 system-ui;color:var(--dim);margin-top:6px;}
.bracket{font:800 11px/1 system-ui;color:var(--dim);text-align:center;margin-top:13px;}

/* badges, en autocollants de travers */
.badges{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));}
.bdg{background:var(--pan);border:2px dashed rgba(255,255,255,.14);border-radius:var(--r);
 padding:12px 7px;text-align:center;opacity:.34;transform:rotate(-1.4deg);}
.bdg:nth-child(2n){transform:rotate(1.6deg);}
.bdg.got{opacity:1;border-style:solid;border-color:var(--butter);
 background:linear-gradient(160deg,rgba(255,216,77,.2),rgba(18,10,38,.8));
 box-shadow:0 4px 0 rgba(185,116,31,.6),0 0 20px rgba(255,216,77,.22);}
.bdg .ic{font-size:24px;}

.sh{display:flex;align-items:flex-start;gap:11px;margin-bottom:13px;}

.steps{font:600 12.5px/1.68 system-ui;color:var(--txt);white-space:pre-wrap;
 background:var(--deep);border-radius:var(--r);padding:12px 13px;
 border-left:4px solid var(--mint);}
.ingl{margin:0;padding:0;list-style:none;}
.ingl li{display:flex;gap:9px;padding:9px 0;align-items:center;
 border-bottom:1px dashed rgba(255,255,255,.07);font:700 12.5px/1.35 system-ui;}
.ingl li:last-child{border-bottom:0;}
.ingl .q{color:var(--butter);font-weight:900;flex:none;min-width:66px;}
.ingl .s{margin-left:auto;font:800 10px/1 system-ui;color:var(--lilac);flex:none;
 background:rgba(180,139,255,.15);border-radius:999px;padding:4px 8px;}
.rate{display:flex;gap:7px;justify-content:center;margin:6px 0 0;}
.rate button{background:none;border:0;font-size:30px;cursor:pointer;color:#4a3a72;
 padding:2px;transition:transform .16s cubic-bezier(.34,1.56,.64,1),color .16s;}

.stepl li:last-child{border-bottom:0;}
.stepl li::before{content:counter(st);position:absolute;left:0;top:10px;

 display:none;flex-direction:column;}

.ckn{font:900 12px/1 system-ui;color:var(--lilac);letter-spacing:1.2px;
 text-transform:uppercase;margin-bottom:16px;text-align:center;}

 max-width:600px;margin:0 auto;}
@media(min-width:700px){.cktx{font-size:31px;}}
.cknav{display:flex;gap:10px;padding:12px 14px calc(16px + env(safe-area-inset-bottom));
 border-top:2px solid rgba(255,255,255,.08);}
.cknav .btn{padding:17px 13px;font-size:14px;}
.ckl{max-width:600px;margin:22px auto 0;width:100%;}

#cv{position:fixed;inset:0;z-index:90;pointer-events:none;}
/* La position verticale est posee par toast(), qui mesure la barre du

footer{text-align:center;color:var(--dim);font-size:11px;padding:0 0 28px;

/* Deux pièges de mots: l'huile d'olive n'est pas une olive, et une tomate
   cerise n'est pas une cerise. Les deux sortent du texte avant la recherche. */
const AVOID_SAFE = ['huile d\'olive','olive oil','tomates cerises','tomate cerise',
                    'cherry tomatoes','cherry tomato'];
function avoidHits(d){
  if (!d) return [];
  var hay = norm((d.name_fr || '') + ' ' + (d.name_en || ''));
  var ings = DB.ings.filter(function(x){ return x.dish_id === d.id; });
  for (var i = 0; i < ings.length; i++)
    hay += ' ' + norm(ings[i].item_fr || '') + ' ' + norm(ings[i].item_en || '');
  for (var k = 0; k < AVOID_SAFE.length; k++) hay = hay.split(norm(AVOID_SAFE[k])).join(' ');
  var out = [];
  for (var j = 0; j < AVOID.length; j++){
    var a = AVOID[j];
    if (hay.indexOf(norm(a.fr)) >= 0 || hay.indexOf(norm(a.en)) >= 0) out.push(a);
  }
  return out;
}

         en:'Heat the oven to 200 and line a tray with parchment, salmon sticks otherwise.\nRinse the quinoa under cold water in a fine sieve, it takes the bitterness off. Cook it in twice its volume of salted water, 15 min covered, then rest it 5 min off the heat.\nMix the maple syrup with crushed garlic and a pinch of salt. Brush it over the salmon fillets, flesh side.\nBake the salmon 14 min. It is done when the flesh flakes into big pieces under a fork and is still slightly translucent in the middle.\nSteam the green beans 6 min while the salmon finishes.\nFluff the quinoa with a fork and serve straight away, salmon keeps cooking on the plate.'},

 {fr:'Pâté chinois allégé', en:'Lighter shepherd\'s pie',

         en:'Peel the sweet potatoes, cut them into big chunks and start them in cold salted water. Bring to the boil and cook 20 min, until a knife goes in with no resistance.\nMeanwhile brown the ground turkey in a pan over medium high, 8 min, breaking it up with a spoon.\nAdd the chopped onion to the meat and cook 5 min more. Season with salt and pepper.\nDrain the potatoes and mash them with the warm milk. Do not use a food processor, they turn gluey.\nHeat the oven to 190. Spread the meat in a dish, then the drained corn, then the mash on top.\nRake the mash with a fork, those ridges are what browns.\nBake 30 min, until the top is golden and it bubbles at the edges. Rest 10 min before cutting.'},

 {fr:'Soupe poulet et orzo', en:'Chicken and orzo soup',

 {fr:'Tofu général Tao au four', en:'Baked General Tao tofu',
  tags:['t_vegetarian','t_veg'], prep:40, serv:2, kcal:450, prot:26, fibre:8, veg:2, cost:10,
  lighten:{fr:'Au four, jamais frit. C\'est tout le gain.', en:'Baked, never deep fried. That is the whole gain.'},
  steps:{fr:'Sortir le tofu de son emballage, le poser entre deux linges propres avec une poêle lourde dessus. Presser 15 min, c\'est l\'étape qui décide de la texture.\nPréchauffer le four à 220 et mettre le riz brun à cuire.\nCouper le tofu en cubes de 2,5 cm. Les mélanger délicatement avec la fécule de maïs dans un bol, chaque face doit être poudrée.\nÉtaler les cubes sur une plaque de papier parchemin sans qu\'ils se touchent. Cuire 22 min en les retournant à mi-cuisson.\nPendant ce temps, faire la sauce: sauce soya, ail râpé, gingembre râpé, un peu de miel et deux cuillerées d\'eau. Réduire 3 à 4 min à feu moyen jusqu\'à ce que ça nappe la cuillère.\nCuire le brocoli à la vapeur 6 min.\nMélanger le tofu à la sauce juste avant de servir. S\'il attend dedans, il ramollit et tout le travail de la première étape est perdu.',
         en:'Take the tofu out of its packet, set it between two clean tea towels with a heavy pan on top. Press 15 min, this is the step that decides the texture.\nHeat the oven to 220 and start the brown rice.\nCut the tofu into 2.5 cm cubes. Toss them gently with the cornstarch in a bowl, every face should be dusted.\nSpread the cubes on a parchment lined tray without touching. Bake 22 min, turning them halfway.\nMeanwhile make the sauce: soy, grated garlic, grated ginger, a little honey and two spoons of water. Reduce 3 to 4 min over medium until it coats the spoon.\nSteam the broccoli 6 min.\nToss the tofu in the sauce just before serving. If it sits in there it goes soft and the first step was wasted.'},

 {fr:'Boeuf et légumes à l\'asiatique', en:'Asian beef and vegetables',
  tags:['t_quick','t_highprot','t_veg'], prep:25, serv:2, kcal:490, prot:40, fibre:7, veg:3, cost:16,
  lighten:{fr:'Boeuf haché maigre, et sauce soya réduite en sel.', en:'Lean ground beef, and low sodium soy sauce.'},

         en:'Start the brown rice first, 35 min.\nPrep every vegetable before you light the stove: broccoli in small florets, carrot in matchsticks, snow peas topped. A stir fry moves too fast to chop along the way.\nHeat a wok or large pan until a drop of water dances on it. Add a splash of oil.\nBrown the ground beef 5 min on high, breaking it up with a spoon. Lift it out and set aside, or it will steam with the vegetables.\nThrow the broccoli and carrot into the hot pan, 3 min. Then the snow peas, 2 min more. They should stay crunchy.\nReturn the beef, add the soy, grated garlic and ginger. Toss 1 min and serve immediately over the rice.'},

 {fr:'Omelette aux épinards et feta', en:'Spinach and feta omelette',
  tags:['t_quick','t_vegetarian','t_light','t_veg'], prep:15, serv:2, kcal:340, prot:26, fibre:4, veg:2, cost:8,
  lighten:{fr:'Quatre oeufs entiers et deux blancs, au lieu de six entiers.', en:'Four whole eggs and two whites, instead of six whole.'},
  steps:{fr:'Battre les oeufs dans un bol avec une pincée de sel jusqu\'à ce que le blanc et le jaune soient complètement mélangés, environ 30 secondes.\nCouper les tomates cerises en deux et ciseler la ciboulette.\nChauffer une poêle antiadhésive à feu moyen, pas plus, une omelette brûlée est une omelette ratée.\nJeter les épinards dans la poêle avec une goutte d\'huile. Ils tombent en 1 min. Ajouter les tomates et cuire 1 min de plus.\nVerser les oeufs par dessus et baisser le feu. Ramener les bords vers le centre à la spatule les 30 premières secondes, puis laisser prendre.\nÉmietter la feta sur le dessus, couvrir et cuire 4 à 5 min. L\'omelette est prête quand le dessus n\'est plus liquide mais encore brillant.\nGlisser sur une assiette, plier en deux, parsemer de ciboulette.',
         en:'Beat the eggs in a bowl with a pinch of salt until white and yolk are completely combined, about 30 seconds.\nHalve the cherry tomatoes and snip the chives.\nHeat a non stick pan over medium, no higher, a scorched omelette is a ruined one.\nDrop the spinach into the pan with a little oil. It wilts in 1 min. Add the tomatoes and cook 1 min more.\nPour the eggs over and turn the heat down. Pull the edges to the centre with a spatula for the first 30 seconds, then leave it to set.\nCrumble the feta over the top, cover and cook 4 to 5 min. It is ready when the top is no longer liquid but still glossy.\nSlide onto a plate, fold in half, scatter the chives.'},

 {fr:'Porc effiloché et salade de chou', en:'Pulled pork and slaw',
  tags:['t_highprot','t_slow','t_prep','t_comfort'], prep:240, serv:6, kcal:510, prot:40, fibre:6, veg:2, cost:18,
  lighten:{fr:'Salade de chou au vinaigre, pas à la mayonnaise. Et l\'épaule dégraissée avant d\'effilocher.', en:'Vinegar slaw, not mayonnaise. And skim the shoulder before pulling it.'},
  steps:{fr:'Frotter l\'épaule de porc partout avec le paprika fumé, du sel, du poivre et un peu de cassonade si vous en avez.\nLa déposer dans la mijoteuse avec 100 ml d\'eau au fond. Pas plus, la viande rend beaucoup de liquide.\nCuire 8 h à basse température. Ne pas soulever le couvercle, chaque coup d\'oeil coûte 20 min.\nSortir la viande sur une planche. Jeter l\'os et les gros morceaux de gras, puis l\'effilocher avec deux fourchettes.\nÉcumer le gras du jus de cuisson à la cuillère, puis remettre un peu de ce jus dégraissé sur la viande pour qu\'elle reste humide.\nPour la salade de chou: râper le chou finement, le mélanger avec le vinaigre de cidre, une pincée de sucre, du sel. Laisser reposer 20 min, il s\'attendrit tout seul.\nServir dans les pains de blé entier, viande puis chou par dessus, le croquant est ce qui fait tenir le sandwich.',
         en:'Rub the pork shoulder all over with smoked paprika, salt, pepper and a little brown sugar if you have it.\nPut it in the slow cooker with 100 ml of water in the bottom. No more, the meat gives up plenty of liquid.\nCook 8 h on low. Do not lift the lid, every peek costs 20 min.\nLift the meat onto a board. Discard the bone and the big lumps of fat, then pull it apart with two forks.\nSkim the fat off the cooking juices with a spoon, then spoon some of that skimmed juice back over the meat so it stays moist.\nFor the slaw: shred the cabbage finely, toss with cider vinegar, a pinch of sugar and salt. Leave 20 min, it softens on its own.\nServe in the whole wheat buns, meat then slaw on top, the crunch is what holds the sandwich together.'},

 {fr:'Pizza pita aux légumes', en:'Veggie pita pizza',

 {fr:'Mijoteuse, boeuf et légumes racines', en:'Slow cooker beef and root vegetables',
  tags:['t_highprot','t_slow','t_prep','t_veg','t_comfort'], prep:300, serv:6, kcal:480, prot:42, fibre:9, veg:3.5, cost:20,
  lighten:{fr:'Plus de légumes racines, moins de boeuf. Le plat reste aussi nourrissant.', en:'More root vegetables, less beef. The dish stays just as filling.'},
  steps:{fr:'Éponger les cubes de boeuf avec du papier absorbant. Une viande humide ne colore pas, elle bout.\nLes saisir dans une poêle très chaude, en deux fois, 2 min par face. Cette croûte est tout le goût du plat.\nDéglacer la poêle avec un peu de bouillon en grattant le fond, et verser ce liquide dans la mijoteuse. Rien de ce qui est collé au fond ne doit rester là.\nPeler et couper les carottes, les panais et le navet en gros morceaux. Trop petits, ils disparaissent en 7 heures.\nTout mettre dans la mijoteuse: boeuf, légumes, oignon émincé, le reste du bouillon, le thym.\nCuire 7 h à basse température. Le boeuf est prêt quand il se défait sous la pression d\'une cuillère.\nGoûter et saler à la fin. Le bouillon a réduit, il est déjà salé.',
         en:'Pat the beef cubes dry with paper towel. Wet meat does not brown, it boils.\nSear them in a very hot pan in two batches, 2 min a side. That crust is where the flavour of the dish comes from.\nDeglaze the pan with a little broth, scraping the bottom, and tip that into the slow cooker. Nothing stuck to the pan should stay there.\nPeel and cut the carrots, parsnips and turnip into big chunks. Too small and they vanish over 7 hours.\nEverything into the slow cooker: beef, vegetables, sliced onion, the rest of the broth, the thyme.\nCook 7 h on low. The beef is ready when it falls apart under the pressure of a spoon.\nTaste and salt at the end. The broth has reduced and is already salty.'},

 {fr:'Dahl de lentilles', en:'Lentil dahl',
  tags:['t_vegetarian','t_veg','t_prep','t_comfort'], prep:40, serv:4, kcal:380, prot:20, fibre:16, veg:2.5, cost:8,
  lighten:{fr:'Lait de coco léger, ou moitié lait de coco et moitié bouillon.', en:'Light coconut milk, or half coconut milk and half broth.'},
  steps:{fr:'Rincer les lentilles rouges à l\'eau froide jusqu\'à ce que l\'eau soit claire, ça enlève l\'amidon qui fait mousser.\nFaire revenir l\'oignon haché dans un filet d\'huile, 6 min à feu moyen, jusqu\'à ce qu\'il soit doré sur les bords.\nAjouter l\'ail et le gingembre râpés, puis le cari. Remuer 1 min, les épices doivent sentir fort avant de mouiller.\nAjouter les lentilles, les tomates broyées, le lait de coco et 300 ml d\'eau. Remuer pour décoller le fond.\nMijoter 25 min à feu doux en remuant toutes les 5 min, les lentilles collent facilement. Le dahl est prêt quand elles se défont complètement.\nCouper le feu et incorporer les épinards, ils tombent dans la chaleur résiduelle en 2 min.\nSaler maintenant seulement. Si c\'est trop épais, allonger avec un peu d\'eau chaude.',
         en:'Rinse the red lentils under cold water until it runs clear, that removes the starch that makes it foam.\nSoften the chopped onion in a splash of oil, 6 min over medium, until golden at the edges.\nAdd the grated garlic and ginger, then the curry powder. Stir 1 min, the spices should smell strong before any liquid goes in.\nAdd the lentils, crushed tomatoes, coconut milk and 300 ml of water. Stir to lift anything off the bottom.\nSimmer 25 min on low, stirring every 5 min, lentils catch easily. It is ready when they have collapsed completely.\nKill the heat and fold in the spinach, it wilts in the residual heat in 2 min.\nSalt only now. If it is too thick, loosen with a little hot water.'},

 {fr:'Poulet à la lime et origan, patates grecques', en:'Lime oregano chicken with Greek potatoes',
  tags:['t_highprot','t_veg'], prep:50, serv:4, kcal:530, prot:45, fibre:6, veg:2, cost:15,
  lighten:{fr:'Les patates au bouillon et à la lime plutôt qu\'à l\'huile, le goût reste, le gras part.', en:'Potatoes in broth and lime rather than oil, the flavour stays, the fat goes.'},
  steps:{fr:'Préchauffer le four à 200.\nCouper les pommes de terre en quartiers et les mettre dans un plat allant au four, en une seule couche.\nMélanger le bouillon, le jus de deux limes, l\'origan, de l\'ail écrasé, du sel. Verser sur les patates, le liquide doit monter à mi-hauteur.\nEnfourner les patates seules 40 min. Elles vont boire le bouillon et confire plutôt que rôtir.\nAprès 15 min, assaisonner les hauts de cuisse et les déposer sur les patates, peau vers le haut.\nPoursuivre 25 min. Le poulet est prêt à 74 degrés, la peau doit être dorée et croustillante.\nS\'il reste du liquide au fond, passer 5 min sous le gril pour le faire disparaître et dorer les patates.',
         en:'Heat the oven to 200.\nCut the potatoes into wedges and put them in an oven dish in a single layer.\nMix the broth, the juice of two limes, the oregano, crushed garlic and salt. Pour over the potatoes, the liquid should come halfway up.\nRoast the potatoes alone for 40 min. They drink the broth and confit rather than roast.\nAfter 15 min, season the chicken thighs and lay them on the potatoes, skin up.\nCarry on 25 min. The chicken is done at 74 degrees, the skin should be golden and crisp.\nIf liquid remains in the bottom, give it 5 min under the broiler to drive it off and colour the potatoes.'},

 {fr:'Poulet teriyaki, riz et brocoli', en:'Teriyaki chicken, rice and broccoli',

 {fr:'Cuisses de poulet rôties, courge et carottes', en:'Roast chicken thighs, squash and carrots',
  tags:['t_highprot','t_veg','t_comfort'], prep:55, serv:4, kcal:540, prot:40, fibre:8, veg:3, cost:16,
  lighten:{fr:'Retirer la peau après la cuisson, elle garde la chair tendre puis s\'en va.', en:'Pull the skin off after cooking, it keeps the meat moist then leaves.'},
  steps:{fr:'Préchauffer le four à 210. Une plaque bien chaude au départ aide les légumes à colorer.\nPeler la courge musquée, retirer les graines et la couper en cubes de 3 cm. Couper les carottes en bâtonnets épais.\nMélanger les légumes avec l\'huile d\'olive, l\'ail en chemise, du sel et du poivre. Les étaler sur une grande plaque sans les entasser, sinon ils cuisent à la vapeur.\nEnfourner les légumes 35 min.\nAprès 30 min, assaisonner les cuisses de poulet et les poser directement sur les légumes, peau vers le haut. Le gras qui coule va les assaisonner.\nPoursuivre 40 min. La peau doit être brune et croustillante, et le jus clair quand on pique la cuisse à l\'os.\nRetirer la peau dans l\'assiette si vous voulez alléger, elle a déjà fait son travail pendant la cuisson.',
         en:'Heat the oven to 210. A hot tray from the start helps the vegetables colour.\nPeel the butternut squash, take out the seeds and cut it into 3 cm cubes. Cut the carrots into thick batons.\nToss the vegetables with olive oil, unpeeled garlic cloves, salt and pepper. Spread them on a big tray without crowding, or they steam instead.\nRoast the vegetables 35 min.\nAfter 30 min, season the chicken thighs and lay them straight on the vegetables, skin up. The fat that runs off seasons them.\nCarry on 40 min. The skin should be brown and crisp, and the juices clear when you pierce the thigh to the bone.\nPull the skin off at the plate if you want it lighter, it has already done its job during cooking.'},

 {fr:'Poulet au beurre allégé', en:'Lighter butter chicken',

 {fr:'Pain de viande à la dinde', en:'Turkey meatloaf',
  tags:['t_highprot','t_prep','t_comfort'], prep:60, serv:5, kcal:430, prot:38, fibre:5, veg:2, cost:13,
  lighten:{fr:'Carotte et courgette râpées dans le mélange: ça garde le pain juteux sans ajouter de gras.', en:'Grated carrot and zucchini in the mix keeps the loaf moist without any added fat.'},
  steps:{fr:'Préchauffer le four à 190.\nRâper les carottes et la courgette à la grosse râpe. Presser la courgette dans un linge pour en sortir l\'eau, sinon le pain de viande sera détrempé.\nHacher l\'oignon très finement, il n\'aura pas le temps de cuire autrement.\nMélanger à la main dans un grand bol: dinde, avoine, oeufs, légumes râpés, oignon, sel, poivre. Mélanger juste assez pour que ce soit homogène, trop pétrir rend la texture caoutchouteuse.\nFormer un pain dans un moule ou sur une plaque. Un pain libre sur plaque dore sur plus de faces.\nCuire 35 min, puis badigeonner de pâte de tomate délayée avec un peu d\'eau.\nPoursuivre 10 min. Le pain est prêt à 74 degrés au centre. Laisser reposer 10 min avant de trancher, sinon il s\'émiette.',
         en:'Heat the oven to 190.\nCoarsely grate the carrots and zucchini. Squeeze the zucchini in a tea towel to get the water out, or the loaf will be soggy.\nChop the onion very finely, it will not have time to cook otherwise.\nMix by hand in a big bowl: turkey, oats, eggs, grated vegetables, onion, salt, pepper. Mix just until even, overworking it turns the texture rubbery.\nShape a loaf in a tin or free form on a tray. Free form on a tray browns on more sides.\nBake 35 min, then brush with tomato paste loosened with a little water.\nCarry on 10 min. It is done at 74 degrees in the centre. Rest 10 min before slicing or it crumbles.'},

 {fr:'Boulettes suédoises et purée de chou-fleur', en:'Swedish meatballs with cauliflower mash',
  tags:['t_highprot','t_comfort'], prep:45, serv:4, kcal:450, prot:36, fibre:6, veg:2.5, cost:15,
  lighten:{fr:'Purée moitié chou-fleur moitié pomme de terre. Personne ne s\'en aperçoit, et c\'est 150 calories de moins.', en:'Mash half cauliflower half potato. Nobody notices, and it is 150 calories less.'},
  steps:{fr:'Préchauffer le four à 200.\nMélanger le boeuf haché avec du sel, du poivre, une pincée de muscade et de quatre-épices si vous en avez. Former des boulettes de la taille d\'une balle de golf, environ 20.\nLes déposer sur une plaque et cuire 20 min, en les retournant une fois. Au four plutôt qu\'à la poêle, elles gardent leur forme et rendent leur gras.\nPendant ce temps, défaire le chou-fleur en bouquets et peler les pommes de terre. Cuire les deux dans l\'eau bouillante salée, 15 min, jusqu\'à ce qu\'un couteau entre sans résistance.\nBien égoutter et laisser évaporer 2 min dans la casserole chaude. L\'eau qui reste rend la purée liquide.\nPiler avec un peu de bouillon chaud, saler. Pas de robot, le chou-fleur devient de la soupe.\nPour la sauce: chauffer le reste du bouillon, le réduire de moitié, couper le feu et fouetter le yogourt grec dedans hors du feu.\nNapper les boulettes de sauce et servir sur la purée.',
         en:'Heat the oven to 200.\nMix the ground beef with salt, pepper, a pinch of nutmeg and allspice if you have it. Roll golf ball sized meatballs, around 20.\nPut them on a tray and bake 20 min, turning once. Oven rather than pan keeps their shape and renders the fat out.\nMeanwhile break the cauliflower into florets and peel the potatoes. Boil both in salted water, 15 min, until a knife goes in with no resistance.\nDrain well and let them steam dry 2 min in the hot pot. Leftover water makes a runny mash.\nMash with a little hot broth and salt. No food processor, cauliflower turns to soup.\nFor the sauce: heat the rest of the broth, reduce it by half, kill the heat and whisk the Greek yogurt in off the heat.\nSpoon the sauce over the meatballs and serve on the mash.'},

 {fr:'Sauté de boeuf et brocoli', en:'Beef and broccoli stir fry',
  tags:['t_quick','t_highprot','t_veg'], prep:22, serv:2, kcal:470, prot:40, fibre:6, veg:3, cost:16,

 {fr:'Côtelettes de porc, pommes et chou braisé', en:'Pork chops with apples and braised cabbage',

         en:'Take the chops out 20 min ahead and pat them dry. A dry surface is what lets them sear.\nShred the cabbage finely and cut the apples into thick wedges, skin on, the skin holds them together.\nSalt and pepper the chops on both sides.\nHeat a heavy pan over high. Sear the chops 4 min a side without moving them, until there is a golden crust. Set them aside on a plate.\nInto the same pan go the cabbage and apples. Scrape the bottom, every stuck brown bit goes into the vegetables.\nAdd the cider vinegar and thyme, cover and braise 15 min over medium low.\nReturn the chops and their resting juices to the cabbage for the last 3 min, just to warm through. They are done at 63 degrees.'},

  tags:['t_quick','t_highprot','t_light','t_fish'], prep:30, serv:2, kcal:480, prot:38, fibre:6, veg:2, cost:17,

  steps:{fr:'Mettre le riz sauvage à cuire en premier, il prend 35 à 40 min, bien plus que le riz blanc.\nPréchauffer le four à 200 et tapisser une plaque de papier parchemin.\nÉponger les filets de truite et vérifier les arêtes en passant le doigt à rebrousse-poil. Les retirer à la pince s\'il y en a.\nSaler, poivrer, déposer des rondelles de lime et de l\'aneth sur la chair.\nCuire 14 min. La truite est prête quand la chair est opaque sur les bords et se détache en flocons, mais reste nacrée au centre.\nCuire les haricots verts à la vapeur 6 min pendant ce temps.\nServir tout de suite, le poisson continue de cuire dans l\'assiette et passe vite de parfait à sec.',
         en:'Start the wild rice first, it takes 35 to 40 min, far longer than white rice.\nHeat the oven to 200 and line a tray with parchment.\nPat the trout fillets dry and check for pin bones by running a finger against the grain. Pull any out with tweezers.\nSalt, pepper, lay lime rounds and dill over the flesh.\nBake 14 min. It is ready when the flesh is opaque at the edges and flakes, but still pearly in the centre.\nSteam the green beans 6 min meanwhile.\nServe immediately, fish keeps cooking on the plate and goes from perfect to dry quickly.'},

 {fr:'Tacos de poisson et salade de chou', en:'Fish tacos with slaw',
  tags:['t_quick','t_highprot','t_veg','t_fish'], prep:28, serv:4, kcal:440, prot:34, fibre:7, veg:2.5, cost:15,
  lighten:{fr:'Poisson au four, jamais pané frit, et la sauce au yogourt grec avec de la lime.', en:'Baked fish, never battered and fried, and the sauce is Greek yogurt with lime.'},
  steps:{fr:'Préchauffer le four à 220.\nRâper le chou très finement. Le mélanger avec le jus d\'une lime, du sel et la coriandre hachée. Laisser reposer 15 min, il s\'attendrit et rend son eau.\nÉponger les filets de tilapia. Les assaisonner, cumin, paprika, ail, sel.\nLes déposer sur une plaque huilée et cuire 12 min. Le poisson est prêt quand il se défait à la fourchette.\nPendant la cuisson, mélanger le yogourt grec avec le jus de l\'autre lime et une pincée de sel pour la sauce.\nRéchauffer les tortillas 30 secondes par face dans une poêle sèche, elles deviennent souples et sentent le maïs grillé.\nDéfaire le poisson en gros morceaux. Monter: tortilla, chou égoutté, poisson, sauce. Égoutter le chou est ce qui évite le taco détrempé.',
         en:'Heat the oven to 220.\nShred the cabbage very finely. Toss it with the juice of one lime, salt and the chopped cilantro. Leave 15 min, it softens and releases water.\nPat the tilapia dry. Season it with cumin, paprika, garlic and salt.\nLay it on an oiled tray and bake 12 min. It is ready when it flakes under a fork.\nWhile it cooks, mix the Greek yogurt with the other lime and a pinch of salt for the sauce.\nWarm the tortillas 30 seconds a side in a dry pan, they go pliable and smell of toasted corn.\nBreak the fish into big pieces. Build: tortilla, drained slaw, fish, sauce. Draining the slaw is what stops a soggy taco.'},

 {fr:'Bol de thon à la japonaise', en:'Japanese tuna bowl',
  tags:['t_quick','t_highprot','t_veg','t_prep','t_fish'], prep:18, serv:2, kcal:450, prot:38, fibre:6, veg:2.5, cost:11,
  lighten:{fr:'Thon dans l\'eau, pas dans l\'huile, et le riz mesuré avant de cuire.', en:'Tuna in water, not oil, and measure the rice before cooking.'},
  steps:{fr:'Mettre le riz brun à cuire, 35 min. C\'est la seule cuisson du plat.\nFaire décongeler les edamames dans l\'eau bouillante 3 min, puis les égoutter et les écosser s\'ils sont en cosses.\nBien égoutter le thon en pressant le couvercle de la boîte, l\'eau détrempe le bol.\nCouper le concombre en demi-lunes fines et râper la carotte à la grosse râpe.\nMélanger la sauce: sauce soya, une cuillerée de vinaigre de riz, une pointe de miel.\nMonter les bols: riz tiède au fond, puis thon, concombre, carotte et edamames en secteurs séparés plutôt que mélangés.\nVerser la sauce au moment de manger et parsemer de graines de sésame. Montée à l\'avance, la salade rend son eau.',
         en:'Start the brown rice, 35 min. It is the only thing that gets cooked.\nThaw the edamame in boiling water 3 min, then drain and pod them if they are in shells.\nDrain the tuna hard by pressing the tin lid, water makes the bowl soggy.\nSlice the cucumber into thin half moons and coarsely grate the carrot.\nMix the sauce: soy, a spoon of rice vinegar, a touch of honey.\nBuild the bowls: warm rice at the bottom, then tuna, cucumber, carrot and edamame in separate sections rather than mixed.\nAdd the sauce as you sit down and scatter sesame seeds. Built ahead, the salad waters itself down.'},

 {fr:'Chili végé aux haricots noirs', en:'Black bean veggie chili',
  tags:['t_vegetarian','t_veg','t_prep','t_slow','t_comfort'], prep:40, serv:4, kcal:390, prot:18, fibre:18, veg:3.5, cost:9,
  lighten:{fr:'Déjà sous 400 avec 18 g de fibres. Une cuillère de yogourt grec remplace la crème sure.', en:'Already under 400 with 18 g of fibre. A spoon of Greek yogurt replaces the sour cream.'},
  steps:{fr:'Peler la patate douce et la couper en cubes de 2 cm, pas plus gros, elle doit cuire en 30 min.\nFaire revenir l\'oignon haché et les carottes en dés dans un filet d\'huile, 7 min à feu moyen.\nAjouter l\'ail et l\'assaisonnement à chili, remuer 1 min jusqu\'à ce que ça embaume.\nAjouter les tomates broyées, les haricots noirs égouttés et rincés, le maïs égoutté et la patate douce.\nVerser 200 ml d\'eau, juste assez pour que tout soit à peine couvert.\nMijoter 30 min à feu doux, à découvert, en remuant toutes les 10 min. Le chili est prêt quand la patate douce s\'écrase sous la cuillère.\nSaler, et si c\'est trop acide, une pincée de sucre équilibre les tomates.',
         en:'Peel the sweet potato and cut it into 2 cm cubes, no bigger, it has to cook in 30 min.\nSoften the chopped onion and diced carrots in a splash of oil, 7 min over medium.\nAdd the garlic and chili seasoning, stir 1 min until it smells strong.\nAdd the crushed tomatoes, the drained and rinsed black beans, the drained corn and the sweet potato.\nPour in 200 ml of water, just enough to barely cover everything.\nSimmer 30 min on low, uncovered, stirring every 10 min. It is ready when the sweet potato crushes under a spoon.\nSalt, and if it tastes sharp, a pinch of sugar balances the tomatoes.'},

 {fr:'Curry de pois chiches et épinards', en:'Chickpea and spinach curry',
  tags:['t_vegetarian','t_veg','t_prep','t_quick'], prep:30, serv:4, kcal:420, prot:18, fibre:14, veg:3, cost:9,
  lighten:{fr:'Lait de coco léger, et les épinards ajoutés hors du feu pour qu\'ils restent verts.', en:'Light coconut milk, and the spinach goes in off the heat so it stays green.'},
  steps:{fr:'Mettre le riz basmati à cuire, 12 min, puis le laisser reposer couvert 5 min.\nFaire revenir l\'oignon haché 6 min à feu moyen dans un filet d\'huile, jusqu\'aux bords dorés.\nAjouter l\'ail et le gingembre râpés, puis le cari. Remuer 1 min à sec, c\'est ce qui ouvre les épices.\nAjouter les pois chiches égouttés et rincés, les tomates broyées et le lait de coco.\nMijoter 20 min à feu doux à découvert. La sauce doit épaissir et napper les pois chiches.\nÉcraser une cuillerée de pois chiches contre la paroi de la casserole, ça lie la sauce naturellement.\nCouper le feu, ajouter les épinards et remuer. Ils tombent en 2 min dans la chaleur résiduelle et restent verts.',
         en:'Start the basmati, 12 min, then rest it covered 5 min.\nSoften the chopped onion 6 min over medium in a splash of oil, until the edges go golden.\nAdd the grated garlic and ginger, then the curry powder. Stir 1 min dry, that is what opens the spices up.\nAdd the drained and rinsed chickpeas, the crushed tomatoes and the coconut milk.\nSimmer 20 min on low, uncovered. The sauce should thicken and coat the chickpeas.\nCrush a spoonful of chickpeas against the side of the pot, it thickens the sauce naturally.\nKill the heat, add the spinach and stir. It wilts in 2 min in the residual heat and stays green.'},

 {fr:'Bol bouddha au quinoa et légumes rôtis', en:'Quinoa buddha bowl with roasted vegetables',
  tags:['t_vegetarian','t_veg','t_prep'], prep:40, serv:2, kcal:460, prot:17, fibre:13, veg:4, cost:10,
  lighten:{fr:'La vinaigrette au tahini allongée à l\'eau et à la lime, une cuillère suffit pour deux bols.', en:'Thin the tahini dressing with water and lime, one spoon covers two bowls.'},
  steps:{fr:'Préchauffer le four à 210.\nPeler la courge et la couper en cubes de 2 cm. Défaire le brocoli en bouquets. Égoutter et bien sécher les pois chiches, l\'humidité les empêche de croustiller.\nMélanger le tout avec de l\'huile, du sel, du paprika. Étaler sur une grande plaque en une seule couche.\nRôtir 30 min, en remuant à mi-cuisson. Les pois chiches doivent craquer sous la dent et la courge être dorée sur les arêtes.\nPendant ce temps, rincer et cuire le quinoa, 15 min à couvert, puis reposer 5 min et égrener à la fourchette.\nFaire la vinaigrette: tahini, jus de lime, un peu d\'ail râpé, du sel. Elle va épaissir d\'un coup, puis se détendre en ajoutant de l\'eau froide cuillerée par cuillerée.\nMonter: quinoa, légumes rôtis, vinaigrette en filet par dessus.',
         en:'Heat the oven to 210.\nPeel the squash and cut it into 2 cm cubes. Break the broccoli into florets. Drain and dry the chickpeas thoroughly, damp ones will not crisp.\nToss everything with oil, salt and paprika. Spread on a big tray in a single layer.\nRoast 30 min, stirring halfway. The chickpeas should crack under a tooth and the squash be golden on its edges.\nMeanwhile rinse and cook the quinoa, 15 min covered, then rest 5 min and fluff with a fork.\nMake the dressing: tahini, lime juice, a little grated garlic, salt. It will seize up suddenly, then loosen as you add cold water a spoon at a time.\nBuild: quinoa, roasted vegetables, dressing drizzled over.'},

 {fr:'Soupe aux lentilles et légumes', en:'Lentil and vegetable soup',
  tags:['t_vegetarian','t_light','t_veg','t_prep','t_comfort'], prep:35, serv:5, kcal:310, prot:17, fibre:15, veg:3.5, cost:7,

  steps:{fr:'Couper l\'oignon, les carottes et le céleri en petits dés réguliers.\nLes faire suer dans un filet d\'huile 8 min à feu moyen, sans les colorer.\nAjouter l\'ail haché et le thym, remuer 1 min.\nRincer les lentilles vertes et les ajouter avec les tomates broyées et le bouillon.\nPorter à ébullition puis baisser et mijoter 30 min à couvert. Les lentilles vertes gardent leur forme, contrairement aux rouges, elles ne doivent pas se défaire.\nGoûter une lentille: elle doit être tendre au coeur sans bouillie autour.\nCouper le feu, ajouter les épinards et remuer 2 min. Saler seulement maintenant, saler tôt durcit la peau des lentilles.',
         en:'Dice the onion, carrots and celery to an even small size.\nSweat them in a splash of oil 8 min over medium, without colouring.\nAdd the chopped garlic and thyme, stir 1 min.\nRinse the green lentils and add them with the crushed tomatoes and broth.\nBring to the boil then drop to a simmer, 30 min covered. Green lentils hold their shape unlike red ones, they should not collapse.\nTaste one: tender through the middle with no mush around it.\nKill the heat, stir in the spinach for 2 min. Salt only now, salting early toughens lentil skins.'},

 {fr:'Lasagne aux légumes et ricotta', en:'Vegetable and ricotta lasagna',
  tags:['t_vegetarian','t_veg','t_prep','t_comfort'], prep:70, serv:6, kcal:470, prot:24, fibre:8, veg:3, cost:14,
  lighten:{fr:'Des tranches de courgette remplacent la moitié des pâtes, et la ricotta est partiellement écrémée.', en:'Zucchini slices replace half the pasta, and the ricotta is part skim.'},
  steps:{fr:'Préchauffer le four à 190.\nTrancher les courgettes dans la longueur, 3 mm d\'épaisseur. Les saler et les laisser dégorger 15 min sur du papier absorbant, puis les éponger. Cette étape évite la lasagne noyée.\nFaire tomber les épinards dans une poêle sèche, 2 min. Les presser fort dans une passoire pour en sortir toute l\'eau, puis les hacher.\nMélanger la ricotta avec les épinards, du sel, du poivre et de la muscade.\nMonter dans un plat: un fond de sauce tomate, des pâtes, le mélange ricotta, des tranches de courgette, de la sauce. Répéter trois fois.\nFinir par de la sauce et la mozzarella. Chaque pâte doit toucher de la sauce, une pâte sèche reste dure.\nCouvrir de papier aluminium et cuire 30 min, puis découvrir et cuire 15 min de plus pour gratiner.\nLaisser reposer 10 min avant de couper, sinon la part s\'effondre.',
         en:'Heat the oven to 190.\nSlice the zucchini lengthwise, 3 mm thick. Salt them and leave 15 min on paper towel, then pat dry. This step is what stops a watery lasagna.\nWilt the spinach in a dry pan, 2 min. Press it hard in a sieve to get all the water out, then chop it.\nMix the ricotta with the spinach, salt, pepper and nutmeg.\nLayer in a dish: a base of tomato sauce, pasta, the ricotta mix, zucchini slices, sauce. Repeat three times.\nFinish with sauce and the mozzarella. Every sheet must touch sauce, a dry sheet stays hard.\nCover with foil and bake 30 min, then uncover and bake 15 min more to brown.\nRest 10 min before cutting or the slice collapses.'},

 {fr:'Tacos aux haricots noirs et patate douce', en:'Black bean and sweet potato tacos',

  lighten:{fr:'Patate douce rôtie plutôt que frite, et la crème remplacée par du yogourt à la lime.', en:'Roast the sweet potato instead of frying, and swap the cream for lime yogurt.'},

         en:'Heat the oven to 220.\nPeel the sweet potatoes and cut them into 2 cm cubes. Toss with oil, cumin, paprika and salt.\nSpread them on a tray without crowding and roast 25 min, stirring halfway. They should caramelise at the edges.\nWarm the drained and rinsed black beans in a pot with a pinch of cumin and two spoons of water. Mash a third of them with a fork, that holds the filling together.\nMash the avocado with lime juice and salt.\nWarm the tortillas 30 seconds a side in a dry pan.\nBuild: beans, sweet potato, avocado, plenty of lime. Two tortillas per taco if they are thin, they tear otherwise.'},

 {fr:'Pad thaï au tofu', en:'Tofu pad thai',
  tags:['t_vegetarian','t_quick','t_veg'], prep:30, serv:3, kcal:480, prot:22, fibre:7, veg:2.5, cost:11,
  lighten:{fr:'Moitié nouilles, moitié chou et carotte râpés. Le bol reste plein, l\'assiette s\'allège.', en:'Half noodles, half shredded cabbage and carrot. The bowl stays full, the plate gets lighter.'},
  steps:{fr:'Faire tremper les nouilles de riz dans l\'eau très chaude, hors du feu, 8 min. Elles doivent plier sans casser mais rester fermes, elles finiront dans la poêle.\nPresser le tofu 10 min sous un poids, puis le couper en cubes de 2 cm.\nRâper le chou et la carotte, hacher les arachides grossièrement. Tout préparer avant d\'allumer.\nMélanger la sauce: sauce soya, jus de deux limes, une cuillerée de sucre ou de miel, un peu d\'eau.\nChauffer un wok à feu vif. Dorer le tofu 6 min sans le brasser trop, il doit croûter. Le réserver.\nCasser l\'oeuf dans le wok, le brouiller 30 secondes, ajouter le chou et la carotte 2 min.\nAjouter les nouilles égouttées et la sauce, sauter 2 min en soulevant plutôt qu\'en remuant, les nouilles cassent facilement.\nRemettre le tofu, couper le feu, parsemer d\'arachides et servir avec un quartier de lime.',
         en:'Soak the rice noodles in very hot water off the heat, 8 min. They should bend without snapping but stay firm, they finish in the pan.\nPress the tofu 10 min under a weight, then cut it into 2 cm cubes.\nShred the cabbage and carrot, roughly chop the peanuts. Prep everything before you light the stove.\nMix the sauce: soy, the juice of two limes, a spoon of sugar or honey, a little water.\nHeat a wok over high. Brown the tofu 6 min without tossing it much, it needs a crust. Set it aside.\nCrack the egg into the wok, scramble 30 seconds, add the cabbage and carrot for 2 min.\nAdd the drained noodles and the sauce, toss 2 min by lifting rather than stirring, noodles break easily.\nReturn the tofu, kill the heat, scatter the peanuts and serve with a lime wedge.'},

 {fr:'Frittata aux patates et épinards', en:'Potato and spinach frittata',
  tags:['t_vegetarian','t_quick','t_prep'], prep:30, serv:4, kcal:360, prot:22, fibre:4, veg:2, cost:8,
  lighten:{fr:'Six oeufs entiers et quatre blancs pour quatre portions, le reste c\'est du légume.', en:'Six whole eggs and four whites for four servings, the rest is vegetables.'},
  steps:{fr:'Préchauffer le four à 190. Utiliser une poêle qui va au four, en fonte ou tout inox, sans manche en plastique.\nTrancher les pommes de terre en rondelles de 3 mm, le plus régulier possible.\nLes faire dorer dans la poêle avec de l\'huile, 10 min à feu moyen, en les retournant. Elles doivent être tendres au centre.\nAjouter l\'oignon émincé, 4 min, puis les épinards jusqu\'à ce qu\'ils tombent.\nBattre les oeufs avec du sel, du poivre et le parmesan râpé.\nVerser les oeufs sur les légumes, secouer la poêle pour les répartir. Cuire 5 min sur le feu, sans toucher, jusqu\'à ce que les bords prennent.\nEnfourner 10 min. La frittata est prête quand le centre ne tremble plus au secouement.\nPasser une spatule tout autour et laisser reposer 5 min avant de glisser sur une planche.',
         en:'Heat the oven to 190. Use an oven safe pan, cast iron or all metal, no plastic handle.\nSlice the potatoes into 3 mm rounds, as even as you can.\nBrown them in the pan with oil, 10 min over medium, turning them. They should be tender in the middle.\nAdd the sliced onion, 4 min, then the spinach until it wilts.\nBeat the eggs with salt, pepper and the grated parmesan.\nPour the eggs over the vegetables and shake the pan to spread them. Cook 5 min on the hob, untouched, until the edges set.\nInto the oven for 10 min. It is done when the centre no longer wobbles when you shake it.\nRun a spatula round the edge and rest 5 min before sliding it onto a board.'},

 {fr:'Shakshuka aux tomates et épinards', en:'Tomato and spinach shakshuka',
  tags:['t_vegetarian','t_quick','t_light','t_veg'], prep:25, serv:2, kcal:340, prot:20, fibre:7, veg:3, cost:7,

  steps:{fr:'Faire revenir l\'oignon haché dans une poêle large avec un filet d\'huile, 6 min à feu moyen.\nAjouter l\'ail, le cumin et le paprika fumé, remuer 1 min.\nAjouter les tomates broyées et la courgette en petits dés. Mijoter 10 min à découvert, la sauce doit épaissir, pas rester liquide, sinon les oeufs se noieront.\nAjouter les épinards et remuer jusqu\'à ce qu\'ils tombent.\nCreuser quatre nids dans la sauce avec le dos d\'une cuillère. Casser un oeuf dans chacun.\nCouvrir et cuire 7 min à feu doux. Les blancs doivent être pris et les jaunes encore coulants. Vérifier à 6 min, ça passe vite.\nServir directement dans la poêle avec le pain grillé pour saucer.',

/* =====================================================================
   Couche de données. Les mêmes fonctions servent en mode Supabase et en
   mode local, pour que tout le code d'affichage ne connaisse qu'une
   seule interface. Voir SPEC section 2.
   ===================================================================== */

const TBL = { dishes:'dishes', ings:'ingredients', plan:'plan', ratings:'ratings',
              pantry:'pantry', list:'list_state', shops:'shops', score:'score',
              members:'members', extras:'extras' };
let EXTRAS_OK = true;   /* faux tant que 04_extras.sql n'a pas ete roule */

const DB = { dishes:[], ings:[], plan:[], ratings:[], pantry:[], list:[],
             shops:[], score:[], members:[], extras:[] };
let LID = 1;

function saveLocal(){
  if (!LOCAL) return;
  try { localStorage.setItem('bouffe_db', JSON.stringify({ db:DB, lid:LID, me:ME })); }
  catch(e){}
}
function readLocal(){
  try {
    var j = localStorage.getItem('bouffe_db');
    if (!j) return false;
    var o = JSON.parse(j);
    for (var k in DB) if (o.db && o.db[k]) DB[k] = o.db[k];
    LID = o.lid || 1;
    ME = o.me || null;
    return true;
  } catch(e){ return false; }
}

async function ins(key, row){
  if (LOCAL){ row.id = LID++; DB[key].push(row); saveLocal(); return row; }
  var r = await sb.from(TBL[key]).insert(row).select().single();
  if (r.error) throw r.error;
  DB[key].push(r.data);
  return r.data;
}
async function upd(key, id, patch){
  var arr = DB[key], i;
  for (i = 0; i < arr.length; i++) if (arr[i].id === id) break;
  if (LOCAL){
    if (i < arr.length) for (var p in patch) arr[i][p] = patch[p];
    saveLocal(); return arr[i];
  }
  var r = await sb.from(TBL[key]).update(patch).eq('id', id).select().single();
  if (r.error) throw r.error;
  if (i < arr.length) arr[i] = r.data;
  return r.data;
}
async function del(key, id){
  if (!LOCAL){
    var r = await sb.from(TBL[key]).delete().eq('id', id);
    if (r.error) throw r.error;
  }
  DB[key] = DB[key].filter(function(x){ return x.id !== id; });
  saveLocal();
}

/* =====================================================================
   Dates. Tout est ancré sur le lundi, parce que la semaine d'épicerie
   et la semaine de pointage doivent être la même.
   ===================================================================== */

function iso(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
function parseISO(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var w = x.getDay();            /* 0 dimanche, 1 lundi */
  return addDays(x, w === 0 ? -6 : 1 - w);
}
let WK = mondayOf(new Date());
let BULK = false;   /* vrai pendant un remplissage en lot, voir surpriseWeek */
function wkISO(){ return iso(WK); }
function todayISO(){ return iso(new Date()); }

/* =====================================================================
   Tuiles dessinées. Aucune photo, aucune image externe, voir SPEC
   section 2. Le dégradé sort du nom, donc un plat garde toujours la
   même couleur, et le glyphe sort du plat lui-même.
   ===================================================================== */

function hashOf(s){
  var h = 0;
  for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function tileStyle(name){
  var h = hashOf(name || 'x') % 360;
  return 'background:linear-gradient(140deg,hsl(' + h + ',74%,56%),hsl(' +
         ((h + 46) % 360) + ',72%,34%))';
}
function tileShape(name){ return 's' + (hashOf(name || 'x') % 4); }
const GLYPHS = [
 ['poulet|chicken',      '\u{1F357}'],
 ['dinde|turkey',        '\u{1F983}'],
 ['saumon|poisson|tilapia|fish|salmon', '\u{1F41F}'],
 ['crevette|shrimp',     '\u{1F364}'],
 ['boeuf|beef',          '\u{1F969}'],
 ['porc|pork',           '\u{1F953}'],
 ['omelette|oeuf|egg',   '\u{1F373}'],
 ['pizza',               '\u{1F355}'],
 ['soupe|soup',          '\u{1F963}'],
 ['salade|salad|cesar|césar|caesar', '\u{1F957}'],
 ['chili',               '\u{1F336}'],
 ['burrito|bol|bowl',    '\u{1F32F}'],
 ['dahl|lentille|lentil|haricot|bean', '\u{1F372}'],
 ['tofu',                '\u{1F331}'],
 ['pâté|pate|pie',       '\u{1F958}'],
 ['mijoteuse|slow',      '\u{1F372}']
];
function glyphOf(d){
  var n = ((d && (d.name_fr || '')) + ' ' + (d && (d.name_en || ''))).toLowerCase();
  for (var i = 0; i < GLYPHS.length; i++){
    var parts = GLYPHS[i][0].split('|');
    for (var j = 0; j < parts.length; j++) if (n.indexOf(parts[j]) >= 0) return GLYPHS[i][1];
  }
  var tg = (d && d.tags) || [];
  if (tg.indexOf('t_vegetarian') >= 0) return '\u{1F966}';
  if (tg.indexOf('t_bbq') >= 0) return '\u{1F356}';
  return '\u{1F37D}';
}
function tile(d, cls){
  var n = dname(d);
  return '<div class="tile ' + tileShape(n) + ' ' + (cls || '') + '" style="' +
         tileStyle(n) + '"><span>' + glyphOf(d) + '</span></div>';
}
function dtext(d, base){
  if (!d) return '';
  var a = d[base + '_fr'], b = d[base + '_en'];
  return (L === 'fr' ? (a || b) : (b || a)) || '';
}
function dname(d){
  if (!d) return '';
  return (L === 'fr' ? (d.name_fr || d.name_en) : (d.name_en || d.name_fr)) || '';
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
         .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function dishByName(n){
  var k = norm(n);
  for (var i = 0; i < DB.dishes.length; i++){
    var d = DB.dishes[i];
    if (norm(d.name_fr) === k || norm(d.name_en) === k) return d;
  }
  return null;
}
/* Une etape par ligne quand le plat en porte, sinon on coupe aux phrases.
   Les plats livres sont ecrits d'un bloc et se coupent proprement, et un
   plat tape a la main se coupe aux retours de ligne. Les deux marchent
   sans toucher a la base. */
function stepList(txt){
  if (!txt) return [];
  var raw = (txt.indexOf('\n') >= 0) ? txt.split('\n') : txt.split(/\.\s+/);
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var x = raw[i].trim();
    if (!x) continue;
    if (!/[.!?]$/.test(x)) x += '.';
    out.push(x);
  }
  return out;
}
function dishById(id){
  for (var i = 0; i < DB.dishes.length; i++) if (DB.dishes[i].id === id) return DB.dishes[i];
  return null;
}
function num(v, d){ var n = parseFloat(v); return isNaN(n) ? (d === undefined ? 0 : d) : n; }

/* On entre un prénom, pas un courriel. Supabase veut une adresse, alors on
   en fabrique une qui ne sort jamais d'ici et qu'aucune boîte ne reçoit.
   Le compte est créé à la main dans Supabase avec cette même adresse. */
const AUTH_DOMAIN = 'bouffe.local';
function addrOf(name){ return norm(name).split(' ').join('') + '@' + AUTH_DOMAIN; }

async function doLogin(){
  var e = document.getElementById('gmail').value.trim();
  var p = document.getElementById('gpass').value;
  var box = document.getElementById('gerr');
  box.textContent = '';
  if (!CONFIGURED || !sb){ box.textContent = t('cfgwarn').replace(/<[^>]+>/g, ''); return; }
  var addr = addrOf(e);
  if (addr.charAt(0) === '@'){ box.textContent = t('needname'); return; }
  document.getElementById('gbtn').disabled = true;
  try {
    var r = await sb.auth.signInWithPassword({ email:addr, password:p });
    if (r.error) throw r.error;
    await afterLogin();
  } catch(err){
    var m = (err && err.message) || '';
    box.textContent = /invalid login/i.test(m) ? t('badlogin') : (m || t('badlogin'));
    document.getElementById('gbtn').disabled = false;
  }
}
async function afterLogin(){
  LOCAL = false;
  await loadAll();
  var u = (await sb.auth.getUser()).data.user;
  ME = null;
  for (var i = 0; i < DB.members.length; i++) if (DB.members[i].id === u.id) ME = DB.members[i];
  /* Un compte hors de la liste blanche ne voit rien, la RLS s'en charge.
     Mieux vaut le dire à la porte que de laisser entrer dans une maison
     vide sans expliquer pourquoi. */
  if (!ME){
    await sb.auth.signOut();
    showGate();
    document.getElementById('gerr').textContent = t('notmember');

function planFor(dayIso, slot){
  for (var i = 0; i < DB.plan.length; i++)
    if (DB.plan[i].day === dayIso && DB.plan[i].slot === slot) return DB.plan[i];
  return null;
}
async function setPlan(dayIso, slot, fields){
  var row = planFor(dayIso, slot);
  var wasNew = !row || row.dish_id !== fields.dish_id;
  if (row) await upd('plan', row.id, fields);
  else {
    var o = { day:dayIso, slot:slot, kind:'cook', dish_id:null, cook_id:null, wash_id:null };
    for (var p in fields) o[p] = fields[p];
    await ins('plan', o);
  }

  if (BULK) return;
  await scoreWeek();
  renderAll();

async function clearPlan(dayIso, slot){
  var row = planFor(dayIso, slot);
  if (row) await del('plan', row.id);
  renderAll();
}

function weekDays(){
  var a = [], i;
  for (i = 0; i < 7; i++) a.push(iso(addDays(WK, i)));
  return a;
}

/* La portion de chacun sort du même plat, voir SPEC section 6. */
function myMult(){ return num(ME && ME.portion_mult, 1) || 1; }

function weekNut(){
  var days = weekDays(), m = myMult();
  var kcal = 0, prot = 0, veg = 0, home = 0, planned = 0, cost = 0;
  for (var i = 0; i < days.length; i++){
    for (var s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (!p) continue;
      planned++;
      if (p.kind === 'cook' || p.kind === 'leftovers'){
        if (p.kind === 'cook') home++;
        var d = dishById(p.dish_id);
        if (d){
          kcal += num(d.kcal) * m;
          prot += num(d.protein_g) * m;
          veg  += num(d.veg_serv) * m;
          if (p.kind === 'cook') cost += num(d.cost_est) / Math.max(1, num(d.servings, 2)) * 2;
        }
      }
    }
  }
  return { kcal:kcal/7, prot:prot/7, veg:veg/7, home:home, planned:planned, cost:cost };
}

function bar(label, val, target, unit, mode){
  /* mode 'ceil': rester dessous est le but, donc vert dessous, ambre dessus.
     mode 'floor': atteindre est le but, donc vert quand atteint. */
  var pct = target > 0 ? Math.min(100, Math.round(val / target * 100)) : 0;
  var col;
  if (mode === 'ceil') col = (target > 0 && val > target) ? 'var(--amb)' : 'var(--grn)';
  else col = (target > 0 && val >= target) ? 'var(--grn)' : 'var(--bp)';
  var over = (mode === 'ceil' && target > 0 && val > target);
  return '<div class="nb"><div class="nl">' + esc(label) + '<span>' +
    Math.round(val) + (unit ? ' ' + esc(unit) : '') + '</span></div>' +
    '<div class="tr"><div class="fi" style="width:' + (over ? 100 : pct) +
    '%;background:' + col + '"></div></div></div>';
}

function renderSeason(){
  var m = new Date().getMonth();
  document.getElementById('seasitems').textContent = SEASON[m][L] || SEASON[m].fr;
}

function renderWeek(){
  renderSeason();
  var days = weekDays();
  var first = WK, last = addDays(WK, 6);
  document.getElementById('wklbl').textContent =
    first.getDate() + ' ' + t('mon')[first.getMonth()] + ' ' +
    '- ' + last.getDate() + ' ' + t('mon')[last.getMonth()];
  document.getElementById('wksub').textContent = first.getFullYear();
  var tb = document.getElementById('todayb');
  var here = iso(WK) === iso(mondayOf(new Date()));
  tb.style.display = here ? 'none' : 'block';
  tb.textContent = t('today');

  var n = weekNut();
  document.getElementById('wkfill').textContent = tf('wkfilln', { n:n.planned });
  var kt = num(ME && ME.kcal_target), pt = num(ME && ME.protein_target);
  document.getElementById('wknut').innerHTML =
    bar(t('n_kcal'), n.kcal, kt, t('u_kcal'), 'ceil') +
    bar(t('n_prot'), n.prot, pt, 'g', 'floor') +
    bar(t('n_veg'), n.veg, 5, '', 'floor') +
    bar(t('n_home'), n.home, 14, '/14', 'floor') +
    '<div class="dim" style="grid-column:1/-1;margin-top:2px">' + esc(t('nutnote')) + '</div>';

  var today = todayISO(), h = '';
  for (var i = 0; i < 7; i++){
    var di = days[i], dd = parseISO(di);
    var dk = 0, ds = ['lunch','supper'], sh = '';
    for (var s = 0; s < 2; s++){
      var p = planFor(di, ds[s]);
      sh += '<div class="slot"><div class="sl">' + esc(t(ds[s])) + '</div>';
      if (!p){
        sh += '<div class="empty">' +
          '<button onclick="openSlot(\'' + di + '\',\'' + ds[s] + '\')">' + esc(t('e_pick')) + '</button>' +
          '<button onclick="spinInto(\'' + di + '\',\'' + ds[s] + '\')">' + esc(t('e_spin')) + '</button>' +
          '</div>';
      } else {
        var d = dishById(p.dish_id);
        if (d) dk += num(d.kcal) * myMult();
        var nm = d ? dname(d) : t('k_' + p.kind);
        var mt = '';
        if (d){
          if (num(d.prep_min)) mt += '<span class="pill">' + num(d.prep_min) + ' ' + esc(t('u_min')) + '</span>';
          if (num(d.kcal)) mt += '<span class="pill' + (num(d.kcal) < 500 ? ' g' : '') + '">' +
            num(d.kcal) + ' ' + esc(t('u_kcal')) + '</span>';
          if (num(d.protein_g)) mt += '<span class="pill a">' + num(d.protein_g) + ' g</span>';
        }
        sh += '<button class="meal" onclick="openSlot(\'' + di + '\',\'' + ds[s] + '\')">' +
          tile(d) + '<div class="mi"><div class="nm">' + esc(nm) + '</div>' +
          '<div class="mt">' + mt + '</div>' +
          (p.kind !== 'cook' ? '<div class="kind">' + esc(t('k_' + p.kind)) + '</div>' : '') +
          '</div></button>';
      }
      sh += '</div>';
    }
    h += '<div class="day' + (di === today ? ' today' : '') + '">' +
      '<div class="dhd"><span class="dn">' + esc(t('dayn')[i]) + '</span>' +
      '<span class="dd">' + dd.getDate() + '</span>' +
      '<span class="kc">' + (dk ? Math.round(dk) + ' ' + esc(t('u_kcal')) : '') + '</span></div>' +
      sh + '</div>';
  }
  document.getElementById('days').innerHTML = h;
}
function shiftWeek(n){ WK = addDays(WK, n * 7); renderAll(); }
function goToday(){ WK = mondayOf(new Date()); renderAll(); }

/* ---- feuille de choix d'un créneau ---- */
function openSlot(dayIso, slot){

      (hasSteps ? '<button class="btn am" style="width:100%;margin-top:10px;padding:15px" ' +
        'onclick="cookMode(' + cur.dish_id + ',0)">&#128293; ' + esc(t('cookmode')) + '</button>' : '') +

      '<button class="btn sm grow" onclick="askCooks(\'' + dayIso + '\',\'' + slot + '\')">' + esc(t('cooks')) + '</button>' +
      '<button class="btn sm wn" onclick="clearSlot(\'' + dayIso + '\',\'' + slot + '\')">' + esc(t('clearslot')) + '</button>' +
      '</div></div>';
  }

  h += '<div class="ttl">' + esc(t('pickdish')) + '</div><div id="slotlist">' + dishRows(dayIso, slot, 'cook') + '</div>';

  var lefts = leftoverCandidates(dayIso);
  if (lefts.length){
    h += '<div class="ttl" style="margin-top:14px">' + esc(t('leftoverof')) + '</div><div>' +
      lefts.map(function(d){
        return '<button class="card" style="margin-bottom:7px" onclick="pickSlot(\'' +
          dayIso + '\',\'' + slot + '\',' + d.id + ',\'leftovers\')">' + tile(d) +
          '<div class="mi"><div class="nm">' + esc(dname(d)) + '</div></div></button>';
      }).join('') + '</div>';
  }

  h += '<div class="ttl" style="margin-top:14px">' + esc(t('otherwise')) + '</div><div class="row">' +
    ['takeout','restaurant','out'].map(function(k){
      return '<button class="btn grow" onclick="pickSlot(\'' + dayIso + '\',\'' + slot +
        '\',null,\'' + k + '\')">' + esc(t('k_' + k)) + '</button>';
    }).join('') + '</div>';

  openSheet(h);

function dishRows(dayIso, slot, kind){
  if (!DB.dishes.length) return '<p class="dim">' + esc(t('nodishes')) + '</p>';
  var ds = DB.dishes.slice().sort(function(a, b){ return dname(a).localeCompare(dname(b)); });
  return ds.map(function(d){
    return '<button class="card" style="margin-bottom:7px" onclick="pickSlot(\'' + dayIso +
      '\',\'' + slot + '\',' + d.id + ',\'' + kind + '\')">' + tile(d) +
      '<div class="mi"><div class="nm">' + esc(dname(d)) + '</div><div class="nu">' +
      (num(d.kcal) ? num(d.kcal) + ' ' + esc(t('u_kcal')) + ' &middot; ' : '') +
      (num(d.protein_g) ? num(d.protein_g) + ' ' + esc(t('u_prot')) + ' &middot; ' : '') +
      num(d.prep_min) + ' ' + esc(t('u_min')) + '</div></div></button>';
  }).join('');
}
function leftoverCandidates(dayIso){
  var out = [], seen = {}, days = weekDays();
  for (var i = 0; i < days.length; i++){
    if (days[i] >= dayIso) continue;
    for (var s = 0; s < 2; s++){
      var p = planFor(days[i], s === 0 ? 'lunch' : 'supper');
      if (p && p.kind === 'cook' && p.dish_id && !seen[p.dish_id]){
        var d = dishById(p.dish_id);
        if (d){ seen[p.dish_id] = 1; out.push(d); }
      }
    }
  }
  return out;
}

function renderFilters(){

  }).join('');
  document.getElementById('dfilters').innerHTML = h;

function setFilter(k){ DFILTER = k; renderFilters(); renderDishes(); }

function ratingFor(dishId, memberId){
  for (var i = 0; i < DB.ratings.length; i++)
    if (DB.ratings[i].dish_id === dishId && DB.ratings[i].member_id === memberId)
      return DB.ratings[i];
  return null;
}
function dishScore(dishId){
  var s = 0, n = 0;
  for (var i = 0; i < DB.ratings.length; i++)
    if (DB.ratings[i].dish_id === dishId){ s += num(DB.ratings[i].stars); n++; }
  return { sum:s, n:n, avg:n ? s / n : 0 };
}
async function setRating(dishId, stars){
  var row = ratingFor(dishId, ME.id);
  if (row) row.stars = stars;
  else { row = { dish_id:dishId, member_id:ME.id, stars:stars }; DB.ratings.push(row); }
  if (LOCAL) saveLocal();
  else {
    var r = await sb.from(TBL.ratings).upsert(
      { dish_id:dishId, member_id:ME.id, stars:stars }, { onConflict:'dish_id,member_id' });
    if (r.error) throw r.error;
  }
  if (dishScore(dishId).n >= 2) await award('rated', PTS.rated, 'd' + dishId);
  renderAll();
  openDish(dishId);
}

function lastEaten(dishId){
  var best = null;
  for (var i = 0; i < DB.plan.length; i++){
    var p = DB.plan[i];
    if (p.dish_id === dishId && p.day <= todayISO() && (!best || p.day > best)) best = p.day;
  }
  return best;
}
function weeksSince(dayIso){
  if (!dayIso) return 999;
  return Math.floor((parseISO(todayISO()) - parseISO(dayIso)) / (86400000 * 7));
}
